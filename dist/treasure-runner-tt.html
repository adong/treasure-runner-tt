         ['call your brother', 'T', 'Enter'],
       ],
       note: 'In 1 player both sets of keys work.',       // optional line under the keys
       touch: 'Swipe to move, tap to jump.',              // optional: how it plays on a phone or tablet
       button: { top: '12px', right: '60px' },            // where the ? button sits (CSS; default: middle of the left edge), or false
     });

   A key string is split at spaces. Each piece becomes a keycap, except lowercase words ("or", "hold", "click",
   "tap", "swipe", "double-tap") and "+", "·", "," and "–", which stay plain text. Write keys as A, Space, Enter, Esc,
   Shift, Tab, ←, ↑, → and ↓. */
(function () {
  const Kit = (window.Kit = window.Kit || {});

  let opts = { title: document.title, keys: [] };
  let isOpen = false, root = null, btn = null;

  // ---------- the freeze ----------
  const rafReal = window.requestAnimationFrame.bind(window);
  const nowReal = performance.now.bind(performance);
  let frozenAt = 0, offset = 0, lastT = 0, held = [], soundWasOn = false;

  performance.now = () => (isOpen ? frozenAt : nowReal()) - offset;
  window.requestAnimationFrame = (cb) => {
    if (isOpen) { held.push(cb); return 0; }
    return rafReal((t) => {
      lastT = Math.max(lastT, t - offset); // never backwards, so no game ever sees a negative dt
      cb(lastT);
    });
  };

  function freeze() {
    frozenAt = nowReal();
    const s = Kit.sound;
    soundWasOn = !!(s && s.isRunning && s.isRunning()); // only wake it again if it was playing when we stopped it
    if (soundWasOn) s.suspend();
  }
  function thaw() {
    offset += nowReal() - frozenAt;
    const cbs = held;
    held = [];
    for (const cb of cbs) window.requestAnimationFrame(cb);
    if (soundWasOn && Kit.sound.resume) Kit.sound.resume();
  }

  // ---------- open / close ----------
  function open() {
    if (isOpen) return;
    build();
    render();
    freeze();
    isOpen = true;
    root.classList.add('on');
    if (btn) btn.classList.add('on');
  }
  function close() {
    if (!isOpen) return;
    isOpen = false;
    root.classList.remove('on');
    if (btn) btn.classList.remove('on');
    thaw();
  }

  // ---------- keys and taps: the panel hears them first ----------
  const MODIFIERS = new Set(['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Fn', 'FnLock', 'OS', 'Hyper', 'Super']);
  function typing(e) {
    const t = e.target;
    return !!t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''));
  }
  function swallow(e) {
    e.stopImmediatePropagation();
    if (!e.metaKey && !e.ctrlKey) e.preventDefault(); // leave browser shortcuts (reload, zoom) alone
  }
  window.addEventListener('keydown', (e) => {
    if (isOpen) {
      swallow(e);
      if (!e.repeat && !MODIFIERS.has(e.key)) close();
      return;
    }
    const isQ = e.key === '?' || (e.code === 'Slash' && e.shiftKey); // Shift + / on any keyboard layout
    if (isQ && !typing(e) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      swallow(e); // also keeps the / key from firing in games that use it (Tank TT, Snow TT Bros)
      if (!e.repeat) open();
    }
  }, true);
  window.addEventListener('keypress', (e) => { if (isOpen) swallow(e); }, true);
  // keyup always reaches the game, so a key held down when the panel opened is never stuck afterwards

  const POINTER = ['pointerdown', 'pointerup', 'pointermove', 'pointercancel', 'mousedown', 'mouseup', 'mousemove',
    'touchstart', 'touchmove', 'touchend', 'touchcancel', 'click', 'dblclick', 'contextmenu', 'wheel'];
  function onPointer(e) {
    const onBtn = btn && btn.contains(e.target);
    if (!isOpen && !onBtn) return;
    e.stopImmediatePropagation(); // no preventDefault on touches: a phone would then never send the click
    if (e.type === 'contextmenu') e.preventDefault();
    if (e.type !== 'click') return; // pointerdown and pointerup are swallowed, so one tap is one click
    const hit = (sel) => isOpen && e.target.closest && e.target.closest(sel);
    if (Kit.lang && hit('#kit-help .kh-lang')) Kit.lang.toggle(); // both stay open
    else if (Kit.sound && Kit.sound.onMute && hit('#kit-help .kh-sound')) Kit.sound.toggleMute();
    else (isOpen ? close() : open());
  }
  for (const t of POINTER) window.addEventListener(t, onPointer, { capture: true, passive: false });

  // ---------- the panel ----------
  const CSS = `
#kit-help { position: fixed; inset: 0; z-index: 2147483000; display: none; align-items: center; justify-content: center;
  padding: 16px; background: rgba(12, 10, 24, 0.62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  font-family: 'Rubik', system-ui, -apple-system, sans-serif; color: #fff; cursor: pointer; }
#kit-help.on { display: flex; }
#kit-help .kh-card { width: min(560px, 100%); max-height: 100%; overflow-y: auto; padding: 18px 20px 16px;
  border-radius: 22px; background: rgba(20, 18, 31, 0.94); border: 3px solid #fff; box-shadow: 0 8px 0 #000, 0 18px 40px rgba(0, 0, 0, 0.45);
  animation: kh-pop 0.22s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes kh-pop { from { transform: scale(0.85); } } /* no fade: the card shows even where animations don't run */
#kit-help .kh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#kit-help .kh-tag { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #18d4ff; }
#kit-help .kh-btns { display: flex; gap: 8px; }
#kit-help .kh-lang, #kit-help .kh-sound { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff;
  cursor: pointer; }
#kit-help .kh-lang svg, #kit-help .kh-sound svg { width: 18px; height: 18px; }
#kit-help .kh-sound.off { background: rgba(120, 20, 40, 0.75); }
#kit-help .kh-lang:hover, #kit-help .kh-sound:hover { background: #ffd400; color: #14121f; border-color: #14121f; }
#kit-help h2 { margin: 2px 0 12px; font-family: 'Rubik', system-ui, sans-serif; font-weight: 800; /* not Bungee: it's all caps and would lose the TT in FlaTTy */
  font-size: clamp(24px, 5vw, 32px); line-height: 1.05; color: #ffd400; text-shadow: 0 3px 0 #000; }
#kit-help table { width: 100%; border-collapse: collapse; }
#kit-help th { padding: 0 6px 6px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-align: left; color: #8cc2ff; }
#kit-help th + th { color: #ffb02e; }
#kit-help td { padding: 5px 6px; vertical-align: middle; font-size: 15px; font-weight: 700; border-top: 1px solid rgba(255, 255, 255, 0.12); }
#kit-help td:first-child { width: 40%; color: #ffe9a8; }
#kit-help td.kh-k { white-space: normal; line-height: 2; font-weight: 600; font-size: 13px; color: #d9d6e8; }
#kit-help kbd { display: inline-block; min-width: 26px; height: 26px; padding: 0 7px; margin: 0 2px; border-radius: 7px;
  background: #fff; color: #14121f; font: 800 13px/26px 'Rubik', system-ui, sans-serif; text-align: center;
  box-shadow: 0 3px 0 #7d7a90; vertical-align: middle; }
#kit-help .kh-note { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: #ffe9a8; }
#kit-help .kh-touch { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.4; color: #c3f0d6; }
#kit-help .kh-foot { margin-top: 12px; font-size: 13px; font-weight: 700; text-align: center; opacity: 0.8; }
#kit-help-btn { position: fixed; z-index: 2147482000; width: 40px; height: 40px; padding: 0; border-radius: 50%;
  border: 3px solid #fff; background: rgba(20, 18, 31, 0.62); color: #fff; cursor: pointer;
  font: 800 22px/34px 'Rubik', system-ui, sans-serif; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#kit-help-btn:hover, #kit-help-btn.on { background: #ffd400; color: #14121f; border-color: #14121f; }
@media (max-height: 520px) { #kit-help td { padding: 3px 6px; } #kit-help h2 { margin-bottom: 6px; } }
`;
  function build() {
    if (root) return;
    const style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);
    root = document.createElement('div');
    root.id = 'kit-help';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Keys');
    document.body.appendChild(root);
  }

  const PLAIN = new Set(['+', '·', ',', '–']);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // English or 中文 through Kit.lang (kit/lang.js) when the game loads it: t(text) uses the game's dictionary,
  // t(en, zh) is an inline pair for the panel's own words.
  const t = (en, zh) => (Kit.lang ? Kit.lang.t(en, zh) : en);
  const plain = (w) => /^[a-z][a-z-]+$/.test(w) || PLAIN.has(w);
  function keycaps(str) {
    if (!str) return '';
    const words = String(str).split(/\s+/).filter(Boolean);
    if (words.every(plain)) return ` ${esc(t(String(str)))} `; // all words ("hold the mouse button and drag"): translate as one
    return words.map((w) => (plain(w) ? ` ${esc(t(w))} ` : `<kbd>${esc(t(w))}</kbd>`)).join('');
  }
  function render() {
    const o = opts;
    const cols = o.cols || [];
    const zh = Kit.lang && Kit.lang.is('zh');
    let html = `<div class="kh-card"><div class="kh-top"><div class="kh-tag">${t('? KEYS', '? 按键')}</div><div class="kh-btns">`;
    const s = Kit.sound;
    if (s && s.onMute) html += `<button type="button" class="kh-sound${s.isMuted() ? ' off' : ''}" title="${t('Sound on / off')}" aria-label="${t('Sound on / off')}" aria-pressed="${s.isMuted()}">${s.icon()}</button>`;
    if (Kit.lang) html += `<button type="button" class="kh-lang" title="${zh ? 'English' : '中文'}" aria-label="English / 中文">${Kit.lang.icon}</button>`;
    html += `</div></div><h2>${esc(t(o.title || ''))}</h2><table>`;
    if (cols.length) html += `<tr><th></th>${cols.map((c) => `<th>${esc(t(c))}</th>`).join('')}</tr>`;
    for (const row of o.keys || []) {
      const [label, ...ks] = row;
      html += `<tr><td>${esc(t(label))}</td>${ks.map((k) => `<td class="kh-k">${keycaps(k)}</td>`).join('')}</tr>`;
    }
    html += `<tr><td>${t('these keys', '看按键')}</td><td class="kh-k" colspan="${Math.max(1, cols.length)}">${keycaps('?')} ${t('or tap the round', '或点圆形')} ${keycaps('?')} ${t('button', '按钮')}</td></tr>`;
    html += '</table>';
    if (o.note) html += `<div class="kh-note">${esc(t(o.note))}</div>`;
    if (o.touch) html += `<div class="kh-touch">👆 ${esc(t(o.touch))}</div>`;
    html += `<div class="kh-foot">⏸ ${t('The game waits for you. Press any key or tap to play on.', '游戏在等你。按任意键或点一下，继续玩。')}</div></div>`;
    root.innerHTML = html;
  }
  if (Kit.lang) Kit.lang.onChange(() => { if (isOpen) render(); });
  if (Kit.sound && Kit.sound.onMute) Kit.sound.onMute(() => { if (isOpen) render(); });

  function placeButton() {
    if (opts.button === false) { if (btn) btn.style.display = 'none'; return; }
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'kit-help-btn';
      btn.type = 'button';
      btn.textContent = '?';
      btn.title = 'Keys (?)';
      btn.setAttribute('aria-label', 'Show the keys');
      build();
      document.body.appendChild(btn);
    }
    // The same spot in every game, the middle of the left edge: corners hold scores, pause buttons and touch pads.
    const pos = Object.assign({ top: 'calc(50% - 20px)', left: 'max(10px, env(safe-area-inset-left))' }, opts.button || {});
    for (const side of ['top', 'right', 'bottom', 'left']) btn.style[side] = pos[side] == null ? '' : pos[side];
    btn.style.display = '';
  }

  function setup(o) {
    opts = Object.assign({ title: document.title, keys: [] }, o || {});
    const go = () => { placeButton(); if (isOpen) render(); };
    if (document.body) go();
    else document.addEventListener('DOMContentLoaded', go, { once: true });
  }

  Kit.help = { setup, open, close, toggle: () => (isOpen ? close() : open()), isOpen: () => isOpen, button: () => btn };
})();

</script>
<script>
/* The game's name, in one place: the page title, the logo and the ? panel read it.
   Alan names the games himself: renaming the game is a one-line change here. */
window.TR_TITLE = 'TT Treasure Runner';
if (typeof document !== 'undefined') document.title = `${window.TR_TITLE} · Teddy & Tommy`;

</script>
<script>
/* TT Treasure Runner: the rules, with no Three.js and no page in them (tools/check.js runs this same file in Node).
   A level is a grid of cells, row 0 at the top (the sky):
     .  empty          #  brick (you can dig it)        @  stone (you can't)
     H  ladder         -  bar (hand over hand)           $  gold
     S  the exit ladder: hidden until every bit of gold is in, then a ladder
     1  Teddy's start (1 player: you)    2  Tommy's start (2 players)    R  a robot vacuum's start
   Everyone moves one cell at a time (and slides smoothly between cells). You can't jump: you walk, climb, hang from bars and
   fall. Z / X dig the brick to your lower left / lower right; the hole stays open a few seconds, then fills back in. A robot
   that falls into a hole is stuck there for a while (and drops any gold it was carrying), then climbs out; if the hole fills
   first it pops back in at the top. You can walk over a stuck robot. If a hole fills with you inside, you pop up out of it.
   Collect all the gold and the exit ladder appears: climb to the top row to win.
     TR.parse(level)               a level's rows → spec (cells, gold, starts, robots)
     TR.create(spec, opts)         a fresh game: { tier: 'easy' | 'normal', players: 1 | 2, robots: true, lives, seed, sabotage }
     TR.step(s, dt, inputs)        advance dt seconds; inputs[i] = { dir: 0 none, 1 left, 2 right, 3 up, 4 down, dig: -1 / 1 }
     TR.restart(s)                 the level from the start again (lives kept)
     TR.solve(spec)                the solver: the moves that clear the level with the robots switched off
     TR.reach(s, r)                can runner r still get some gold (or the exit)? (the "stuck? press R" helper) */
(function () {
  'use strict';
  const TR = (typeof window !== 'undefined' ? window : globalThis).TR = (typeof window !== 'undefined' ? window : globalThis).TR || {};

  const E = 0, BRICK = 1, STONE = 2, LADDER = 3, BAR = 4, EXIT = 5;
  const TILE = { '.': E, ' ': E, '#': BRICK, '@': STONE, H: LADDER, '-': BAR, S: EXIT, $: E, 1: E, 2: E, R: E };
  const CHAR = ['.', '#', '@', 'H', '-', 'S'];
  const NONE = 0, LEFT = 1, RIGHT = 2, UP = 3, DOWN = 4;

  // 🐣 EASY (Tommy, 5): slower robots, holes that stay open longer, more lives. 🔥 NORMAL (Teddy, 8). Speeds in cells a second.
  const TIERS = {
    easy: { run: 4.2, climb: 3.6, fall: 6.5, robot: 1.8, robotFall: 4.2, hole: 8, stuck: 4.5, dig: 0.34, catchR: 0.5, lives: 5, respawn: 1.8, caught: 1.7, ready: 1.4, carry: [4, 8], pick: 0.5 },
    normal: { run: 4.8, climb: 4.2, fall: 7.5, robot: 3.0, robotFall: 5.5, hole: 5, stuck: 3, dig: 0.3, catchR: 0.62, lives: 3, respawn: 1.2, caught: 1.7, ready: 1.1, carry: [3, 7], pick: 0.6 },
  };
  const SCORE = { gold: 100, stuck: 50, trap: 200, clear: 1000 };
  const BUDDY_HOLE = 1.6; // your brother's holes stay open this many times as long as yours
  const TICK = 1 / 60;

  // ---------------------------------------------------------------- levels

  function parse(level) {
    const rows = level.rows.map((r) => r.replace(/\s+$/, ''));
    const H = rows.length, W = Math.max(...rows.map((r) => r.length));
    const n = W * H;
    const tiles = new Uint8Array(n), gold = new Uint8Array(n);
    const starts = [], robots = [], exits = [], goldList = [], bad = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ch = rows[y][x] || '.';
        const c = y * W + x;
        if (!(ch in TILE)) bad.push(ch);
        tiles[c] = TILE[ch] || E;
        if (ch === '$') { gold[c] = 1; goldList.push(c); }
        if (ch === '1') starts[0] = c;
        if (ch === '2') starts[1] = c;
        if (ch === 'R') robots.push(c);
        if (ch === 'S') exits.push(c);
      }
    }
    const gi = new Int8Array(n).fill(-1);
    goldList.forEach((c, i) => (gi[c] = i));
    const spec = { id: level.id, name: level.name || '', W, H, n, tiles, gold, gi, goldList, total: goldList.length, starts, robots, exits, bad, rows };
    if (starts[0] == null) starts[0] = 0;
    if (starts[1] == null) starts[1] = partnerStart(spec);
    spec.rest = restCells(spec);
    return spec;
  }

  // 2 players and no '2' in the level: the nearest standing spot beside the first start
  function partnerStart(spec) {
    const { W, starts } = spec, s0 = starts[0], x0 = s0 % W, y0 = (s0 / W) | 0;
    for (const dx of [1, -1, 2, -2, 3, -3]) {
      const x = x0 + dx;
      if (x < 0 || x >= W) continue;
      const c = y0 * W + x;
      if (spec.tiles[c] !== BRICK && spec.tiles[c] !== STONE && !spec.gold[c] && staticSup(spec, x, y0)) return c;
    }
    return s0;
  }

  function staticSup(spec, x, y) {
    const { W, H, tiles } = spec;
    if (y >= H - 1) return true;
    const t = tiles[y * W + x];
    if (t === BAR || t === LADDER) return true;
    const b = tiles[(y + 1) * W + x];
    return b === BRICK || b === STONE || b === LADDER;
  }

  // The cells a runner can stand in, reachable from the start (exit shut): where a robot may put gold down.
  function restCells(spec) {
    const rest = new Uint8Array(spec.n);
    const r = reachFrom(spec, { x: spec.starts[0] % spec.W, y: (spec.starts[0] / spec.W) | 0, h: false }, { mask: 0, full: -1, open: false });
    for (let k = 0; k < r.seen.length; k++) {
      if (r.seen[k] && !(k & 1)) {
        const c = k >> 1;
        if (spec.tiles[c] === E) rest[c] = 1;
      }
    }
    for (const c of spec.goldList) rest[c] = 1; // gold's own homes always count
    return rest;
  }

  // ---------------------------------------------------------------- a game

  function create(spec, opts = {}) {
    const tier = TIERS[opts.tier] ? opts.tier : 'easy';
    const cfg = Object.assign({}, TIERS[tier]);
    const s = {
      spec, tier, cfg, opts, W: spec.W, H: spec.H, t: 0,
      hole: new Uint8Array(spec.n), holeT: new Float32Array(spec.n), holes: 0, long: new Uint8Array(spec.n),
      gold: spec.gold.slice(), left: spec.total, carried: 0, got: 0, exitOpen: false,
      runners: [], robots: [], events: [], score: 0, lives: opts.lives != null ? opts.lives : cfg.lives,
      won: false, wonBy: -1, over: false, ready: 0, seed: (opts.seed != null ? opts.seed : 20261024) >>> 0, sab: opts.sabotage || null,
      reachT: 0,
    };
    const players = opts.players === 2 ? 2 : 1;
    for (let i = 0; i < players; i++) s.runners.push(actor('runner', i, spec.starts[i], spec.W));
    if (opts.robots !== false) spec.robots.forEach((c, i) => s.robots.push(actor('robot', i, c, spec.W)));
    if (s.left === 0) s.exitOpen = true;
    return s;
  }

  function actor(kind, i, c, W) {
    const x = c % W, y = (c / W) | 0;
    return {
      kind, i, home: c, x, y, tx: x, ty: y, p: 0, moving: false, how: 'stand', face: kind === 'robot' ? -1 : 1,
      digT: 0, digAt: -1, digBuf: 0, digBufT: 0, dir: 0, stuckT: 0, gold: -1, carryT: 0, outT: 0, caughtT: 0, waitT: 0,
      stuck: false, cx: x, cy: y,
    };
  }

  function restart(s) {
    const n = create(s.spec, Object.assign({}, s.opts, { lives: s.lives }));
    if (s.sab === 'restart') { // sabotage: R keeps the gold you'd picked up
      n.gold = s.gold.slice();
      n.left = s.left;
      n.got = s.got;
    }
    return n;
  }

  // ---------------------------------------------------------------- helpers

  const rnd = (s) => {
    s.seed = (s.seed + 0x6d2b79f5) >>> 0;
    let t = s.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const ev = (s, type, a, b) => s.events.push({ type, a, b, t: s.t });
  const inB = (s, x, y) => x >= 0 && x < s.W && y >= 0 && y < s.H;
  const tileAt = (s, x, y) => s.spec.tiles[y * s.W + x];
  const ladderish = (s, t) => t === LADDER || (t === EXIT && s.exitOpen);
  // the cell an actor is nearest to (half way through a step it belongs to the next cell)
  const cellOf = (s, a) => (a.moving && a.p >= 0.5 ? a.ty * s.W + a.tx : a.y * s.W + a.x);
  const fx = (a) => (a.how === 'caught' ? a.cx : a.x + (a.tx - a.x) * a.p);
  const fy = (a) => (a.how === 'caught' ? a.cy : a.y + (a.ty - a.y) * a.p);

  function passable(s, x, y) {
    if (!inB(s, x, y)) return false;
    const c = y * s.W + x, t = s.spec.tiles[c];
    if (t === STONE) return false;
    if (t === BRICK) return s.hole[c] === 2;
    return true;
  }

  function robotAt(s, c, not) {
    for (const o of s.robots) if (o !== not && o.how !== 'out' && cellOf(s, o) === c) return o;
    return null;
  }
  // a robot standing or moving into cell c (robots never share a cell)
  function robotIn(s, c, not) {
    for (const o of s.robots) {
      if (o === not || o.how === 'out') continue;
      if (o.y * s.W + o.x === c || (o.moving && o.ty * s.W + o.tx === c)) return o;
    }
    return null;
  }

  function supported(s, x, y, a) {
    if (a && a.kind === 'runner' && s.sab === 'float') return true; // sabotage: runners never fall
    if (y >= s.H - 1) return true;
    const t = tileAt(s, x, y);
    if (ladderish(s, t)) return true;
    if (t === BAR) return true;
    const c2 = (y + 1) * s.W + x, b = s.spec.tiles[c2];
    if (b === STONE || ladderish(s, b)) return true;
    if (b === BRICK && s.hole[c2] !== 2) return true;
    return !s.opts.ghost && !!robotAt(s, c2, a); // standing on a robot's head (not on the title screen's ghost robots)
  }

  function canEnter(s, x, y, a) {
    if (!passable(s, x, y)) return false;
    const c = y * s.W + x;
    if (a.kind === 'runner') {
      if (s.opts.ghost) return true;
      const o = robotAt(s, c, null);
      return !(o && o.how === 'hole'); // a stuck robot fills its hole: walk over it, not into it
    }
    return !robotIn(s, c, a);
  }

  function go(a, dx, dy, how) {
    a.tx = a.x + dx;
    a.ty = a.y + dy;
    a.p = 0;
    a.moving = true;
    a.how = how;
    if (dx) a.face = dx;
  }

  function stop(a, x, y) {
    a.x = a.tx = x;
    a.y = a.ty = y;
    a.p = 0;
    a.moving = false;
  }

  function speedOf(s, a) {
    const c = s.cfg;
    if (a.kind === 'runner') return a.how === 'fall' ? c.fall : a.how === 'climb' ? c.climb : c.run;
    if (a.how === 'fall') return c.robotFall;
    if (a.how === 'climbout') return c.robot * 0.8;
    return c.robot;
  }

  const restingHow = (s, x, y) => {
    const t = tileAt(s, x, y);
    if (t === BAR) return 'bar';
    if (ladderish(s, t)) return 'ladder';
    if (t === BRICK && s.hole[y * s.W + x] === 2) return 'hole';
    return 'stand';
  };

  // ---------------------------------------------------------------- the clock

  function step(s, dt, inputs) {
    let left = dt;
    while (left > 1e-9) {
      const h = Math.min(left, TICK);
      tick(s, h, inputs || []);
      left -= h;
    }
    return s;
  }

  function tick(s, dt, inputs) {
    s.t += dt;
    if (s.won || s.over) return;
    if (s.ready > 0) s.ready = Math.max(0, s.ready - dt);
    holes(s, dt);
    s.runners.forEach((r, i) => runner(s, r, inputs[i], dt));
    if (s.won) return;
    if (!s.ready) for (const b of s.robots) robot(s, b, dt);
    if (!s.ready) catches(s);
    for (const r of s.runners) if (s.exitOpen && !r.moving && r.y === 0 && r.how !== 'caught' && !s.won) win(s, r);
    s.reachT -= dt;
    if (s.reachT <= 0) {
      s.reachT = 0.5;
      for (const r of s.runners) if (atRest(s, r)) r.stuck = !reach(s, r);
    }
  }

  const atRest = (s, r) => !r.moving && r.how !== 'dig' && r.how !== 'caught' && r.how !== 'fall' && supported(s, r.x, r.y, r);

  // ---------------------------------------------------------------- holes

  function holes(s, dt) {
    if (!s.holes) return;
    let open = 0;
    for (let c = 0; c < s.spec.n; c++) {
      if (!s.hole[c]) continue;
      s.holeT[c] -= dt;
      if (s.holeT[c] > 0) { open++; continue; }
      if (s.hole[c] === 1) {
        s.hole[c] = 2;
        s.holeT[c] = s.cfg.hole * (s.long[c] ? BUDDY_HOLE : 1); // your brother's holes stay open a bit longer
        s.long[c] = 0;
        open++;
        ev(s, 'open', c);
      } else if (s.sab === 'nofill') {
        s.holeT[c] = 1e9; // sabotage: holes never fill
        open++;
      } else fill(s, c);
    }
    s.holes = open;
  }

  function fill(s, c) {
    s.hole[c] = 0;
    s.holeT[c] = 0;
    ev(s, 'fill', c);
    // anyone less than half way into the cell turns back; anyone in it pops out (a runner) or is trapped (a robot)
    for (const a of s.runners.concat(s.robots)) {
      if (a.moving && a.ty * s.W + a.tx === c && a.p < 0.5) stop(a, a.x, a.y);
    }
    for (const r of s.runners) if (r.how !== 'caught' && cellOf(s, r) === c) pop(s, r, c);
    for (const b of s.robots) if (b.how !== 'out' && cellOf(s, b) === c) trapped(s, b, c);
  }

  // The brick grows back with a runner inside: he pops up out of it (never stuck, never squashed).
  function pop(s, r, c) {
    const W = s.W, x = c % W, y = (c / W) | 0;
    if (s.sab === 'trap') { // sabotage: he stays inside the brick
      stop(r, x, y);
      r.how = 'stand';
      return;
    }
    let to = -1;
    for (let yy = y - 1; yy >= 0 && to < 0; yy--) if (passable(s, x, yy)) to = yy * W + x;
    if (to < 0) {
      let best = 1e9;
      for (let k = 0; k < s.spec.n; k++) {
        const kx = k % W, ky = (k / W) | 0;
        const d = Math.abs(kx - x) + Math.abs(ky - y);
        if (d && d < best && passable(s, kx, ky)) { best = d; to = k; }
      }
    }
    stop(r, to % W, (to / W) | 0);
    r.how = 'stand';
    r.digT = 0;
    ev(s, 'pop', r.i, c);
  }

  function trapped(s, b, c) {
    if (b.gold >= 0) dropGold(s, b, b.gold);
    stop(b, c % s.W, (c / s.W) | 0);
    b.how = 'out';
    b.outT = s.cfg.respawn;
    s.score += SCORE.trap;
    ev(s, 'trap', b.i, c);
  }

  function canDig(s, r, d) {
    if (r.moving || r.how === 'dig' || r.how === 'caught') return false;
    const x = r.x, y = r.y;
    if (!supported(s, x, y, r) || tileAt(s, x, y) === BAR) return false; // not while falling or hanging
    const tx = x + d, ty = y + 1;
    if (!inB(s, tx, ty)) return false;
    const c = ty * s.W + tx, above = y * s.W + tx;
    if (s.spec.tiles[c] !== BRICK || s.hole[c]) return false; // bricks only, and not one that's already dug
    const ta = s.spec.tiles[above];
    // the cell beside him must be clear: no ladder, bar, wall, gold or anybody in it (an open hole is fine)
    if (!(ta === E || (ta === BRICK && s.hole[above] === 2)) || s.gold[above]) return false;
    for (const o of s.runners) if (o !== r && o.how !== 'caught' && cellOf(s, o) === above) return false;
    if (!s.opts.ghost && robotIn(s, above, null)) return false;
    return true;
  }

  function startDig(s, r, d) {
    const c = (r.y + 1) * s.W + r.x + d;
    r.how = 'dig';
    r.digT = s.cfg.dig;
    r.face = d;
    r.digAt = c;
    s.hole[c] = 1;
    s.holeT[c] = s.cfg.dig;
    s.holes++;
    ev(s, 'dig', r.i, c);
  }

  // ---------------------------------------------------------------- runners

  function runner(s, r, inp, dt) {
    if (inp) {
      if (inp.dig) {
        r.digBuf = inp.dig;
        r.digBufT = 0.35;
        inp.dig = 0;
      }
      r.dir = inp.dir || 0;
    }
    if (r.digBufT > 0) {
      r.digBufT -= dt;
      if (r.digBufT <= 0) r.digBuf = 0;
    }
    if (r.how === 'caught') {
      r.caughtT -= dt;
      if (r.caughtT <= 0) respawnRunner(s, r);
      return;
    }
    if (r.how === 'dig') {
      r.digT -= dt;
      if (r.digT > 0) return;
      r.how = restingHow(s, r.x, r.y);
    }
    let time = dt;
    for (let guard = 0; guard < 4 && time > 1e-9; guard++) {
      if (r.moving) {
        reverse(s, r);
        const sp = speedOf(s, r), need = (1 - r.p) / sp;
        if (time < need) {
          r.p += time * sp;
          break;
        }
        time -= need;
        arrive(s, r);
        if (s.won || r.how === 'caught') return;
      } else if (!decide(s, r)) break;
    }
  }

  // Turn round half way through a step (walking, hanging or climbing), so the keys feel quick.
  function reverse(s, r) {
    const d = r.dir, dx = r.tx - r.x, dy = r.ty - r.y;
    const back = (dx === 1 && d === LEFT) || (dx === -1 && d === RIGHT) || (dy === -1 && d === DOWN && r.how === 'climb') || (dy === 1 && d === UP && r.how === 'climb');
    if (!back || r.how === 'fall') return;
    [r.x, r.tx] = [r.tx, r.x];
    [r.y, r.ty] = [r.ty, r.y];
    r.p = 1 - r.p;
    if (dx) r.face = -dx;
  }

  function decide(s, r) {
    const x = r.x, y = r.y;
    if (!supported(s, x, y, r)) {
      if (r.how !== 'fall') ev(s, 'fall', r.i);
      go(r, 0, 1, 'fall');
      return true;
    }
    if (r.how === 'fall') ev(s, 'land', r.i);
    const t = tileAt(s, x, y);
    r.how = restingHow(s, x, y);
    if (r.digBuf && canDig(s, r, r.digBuf)) {
      startDig(s, r, r.digBuf);
      r.digBuf = 0;
      r.digBufT = 0;
      return false;
    }
    const d = r.dir;
    if (d === LEFT || d === RIGHT) {
      const dx = d === LEFT ? -1 : 1;
      r.face = dx;
      if (!canEnter(s, x + dx, y, r)) return false;
      go(r, dx, 0, t === BAR || tileAt(s, x + dx, y) === BAR ? 'bar' : 'walk');
      return true;
    }
    if (d === UP) {
      if (!ladderish(s, t) || y === 0 || !canEnter(s, x, y - 1, r)) return false;
      go(r, 0, -1, 'climb');
      return true;
    }
    if (d === DOWN) {
      if (y >= s.H - 1 || !canEnter(s, x, y + 1, r)) return false;
      if (ladderish(s, tileAt(s, x, y + 1)) || ladderish(s, t)) go(r, 0, 1, 'climb');
      else if (t === BAR) go(r, 0, 1, 'fall'); // let go of the bar
      else return false;
      return true;
    }
    return false;
  }

  function arrive(s, a) {
    a.x = a.tx;
    a.y = a.ty;
    a.p = 0;
    a.moving = false;
    const c = a.y * s.W + a.x;
    if (a.kind === 'robot') return robotArrive(s, a, c);
    // sabotage 'nobar': a falling runner goes straight through bars
    if (a.how === 'fall' && s.sab === 'nobar' && tileAt(s, a.x, a.y) === BAR && !supportedBelow(s, a.x, a.y, a)) {
      a.moving = true;
      a.ty = a.y + 1;
      a.tx = a.x;
    }
    if (s.gold[c]) {
      s.gold[c] = 0;
      s.left--;
      s.got++;
      s.score += SCORE.gold;
      ev(s, 'gold', a.i, c);
      openExit(s);
    }
    if (s.exitOpen && a.y === 0 && !a.moving) win(s, a);
  }

  function supportedBelow(s, x, y, a) {
    if (y >= s.H - 1) return true;
    const c2 = (y + 1) * s.W + x, b = s.spec.tiles[c2];
    return b === STONE || ladderish(s, b) || (b === BRICK && s.hole[c2] !== 2) || !!robotAt(s, c2, a);
  }

  function openExit(s) {
    if (!s.exitOpen && s.left === 0 && s.carried === 0) {
      s.exitOpen = true;
      ev(s, 'exit');
    }
  }

  function win(s, r) {
    s.won = true;
    s.wonBy = r.i;
    s.score += SCORE.clear;
    ev(s, 'win', r.i);
  }

  function respawnRunner(s, r) {
    if (s.lives <= 0) {
      s.over = true;
      ev(s, 'over');
      return;
    }
    stop(r, r.home % s.W, (r.home / s.W) | 0);
    r.how = 'stand';
    r.digBuf = 0;
    r.stuck = false;
    for (const b of s.robots) {
      if (b.gold >= 0) dropGold(s, b, b.gold);
      stop(b, b.home % s.W, (b.home / s.W) | 0);
      b.how = 'stand';
      b.stuckT = b.outT = b.waitT = 0;
    }
    s.ready = s.cfg.ready;
    ev(s, 'ready', r.i);
  }

  function catches(s) {
    if (s.opts.ghost) return;
    const R = s.cfg.catchR;
    for (const r of s.runners) {
      if (r.how === 'caught') continue;
      const rx = fx(r), ry = fy(r);
      for (const b of s.robots) {
        if (b.how === 'out' || b.how === 'hole') continue;
        if (Math.abs(fx(b) - rx) < R && Math.abs(fy(b) - ry) < R) {
          r.cx = rx;
          r.cy = ry;
          r.how = 'caught';
          r.caughtT = s.cfg.caught;
          r.moving = false;
          r.digBuf = 0;
          s.lives--;
          ev(s, 'caught', r.i, b.i);
          break;
        }
      }
    }
  }

  // ---------------------------------------------------------------- your brother's holes
  // Called in (1 player), the other brother digs a row of holes in the floor in front of the nearest robot, on the side
  // it would walk to get you. A hole needs a brick with nothing in the cell above it (no ladder, bar, gold or anybody).

  function holeOK(s, x, y) {
    if (!inB(s, x, y) || y === 0) return false;
    const c = y * s.W + x, above = c - s.W;
    if (s.spec.tiles[c] !== BRICK || s.hole[c] || s.spec.tiles[above] !== E || s.gold[above]) return false;
    for (const r of s.runners) if (r.how !== 'caught' && (cellOf(s, r) === above || cellOf(s, r) === c)) return false;
    return !robotIn(s, above, null);
  }

  function buddyPlan(s, max = 3) {
    // robots walking about, nearest to a runner first
    const cand = [];
    for (const b of s.robots) {
      if (b.how === 'out' || b.how === 'hole') continue;
      let bd = 1e9, near = null;
      for (const r of s.runners) {
        if (r.how === 'caught') continue;
        const d = Math.abs(fx(r) - fx(b)) + Math.abs(fy(r) - fy(b)) * 1.5;
        if (d < bd) { bd = d; near = r; }
      }
      if (near) cand.push({ b, d: bd, near });
    }
    if (!cand.length) return { robot: -1, cells: [] };
    cand.sort((p, q) => p.d - q.d);
    for (const { b, near } of cand) {
      // first choice: bricks under the cells it's about to walk through on its way to you, as far as it gets before they fill
      const route = chase(s, b, near, true) || [];
      const reach = Math.max(2, Math.floor((s.cfg.hole * BUDDY_HOLE - 1.5) * s.cfg.robot));
      // holes with something solid under them trap it; ones over thin air just drop it down a floor
      const traps = [], drops = [];
      for (const c of route.slice(0, reach)) {
        const x = c % s.W, y = (c / s.W) | 0;
        if (cellOf(s, near) === c) break; // not under your own feet
        if (s.spec.tiles[c] !== E || !holeOK(s, x, y + 1)) continue;
        const under = y + 2 >= s.H ? STONE : s.spec.tiles[c + 2 * s.W];
        (under === BRICK || under === STONE ? traps : drops).push(c + s.W);
      }
      const cells = (traps.length ? traps : drops).slice(0, max);
      if (cells.length) return { robot: b.i, cells, dir: 0 };
      const toward = fx(near) >= fx(b) ? 1 : -1;
      for (const dir of [toward, -toward]) {
        // the floor in front of it: up to three bricks within eight cells (a ladder or gold in the way is skipped)
        const cells = [];
        for (let k = 1; k <= 8 && cells.length < max; k++) {
          const x = b.x + dir * k, y = b.y + 1;
          if (!inB(s, x, b.y) || !passable(s, x, b.y)) break; // a wall: it can't come this way
          if (holeOK(s, x, y)) cells.push(y * s.W + x);
        }
        if (cells.length) return { robot: b.i, cells, dir };
      }
    }
    return { robot: cand[0].b.i, cells: [] };
  }

  function digAt(s, c) {
    if (!holeOK(s, c % s.W, (c / s.W) | 0)) return false;
    s.hole[c] = 1;
    s.holeT[c] = s.cfg.dig;
    s.long[c] = 1;
    s.holes++;
    ev(s, 'dig', -1, c);
    return true;
  }

  // ---------------------------------------------------------------- robots

  function robot(s, b, dt) {
    if (b.how === 'out') {
      b.outT -= dt;
      if (b.outT <= 0) respawnRobot(s, b);
      return;
    }
    if (b.gold >= 0 && b.how !== 'hole') b.carryT -= dt;
    if (b.how === 'hole') {
      b.stuckT -= dt;
      if (b.stuckT > 0) return;
      if (!climbOut(s, b)) {
        b.stuckT = 0.2;
        return;
      }
    }
    if (b.waitT > 0) {
      b.waitT -= dt;
      if (b.waitT > 0 && !b.moving) return;
    }
    let time = dt;
    for (let guard = 0; guard < 3 && time > 1e-9; guard++) {
      if (b.moving) {
        const sp = speedOf(s, b), need = (1 - b.p) / sp;
        if (time < need) {
          b.p += time * sp;
          break;
        }
        time -= need;
        arrive(s, b);
        if (b.how === 'hole' || b.how === 'out') break;
      } else if (!decideRobot(s, b)) break;
    }
  }

  function robotArrive(s, b, c) {
    if (s.hole[c] === 2 && supportedBelow(s, b.x, b.y, b)) {
      // in a hole: stuck for a while, and any gold it carried pops out on top
      b.how = 'hole';
      b.stuckT = s.cfg.stuck;
      s.score += SCORE.stuck;
      ev(s, 'stuck', b.i, c);
      if (b.gold >= 0 && s.sab !== 'keepgold') dropGold(s, b, c - s.W);
      return;
    }
    if (b.how === 'climbout') b.how = 'stand';
    if (s.gold[c] && b.gold < 0 && rnd(s) < s.cfg.pick) {
      s.gold[c] = 0;
      s.left--;
      s.carried++;
      b.gold = c;
      b.carryT = s.cfg.carry[0] + rnd(s) * (s.cfg.carry[1] - s.cfg.carry[0]);
      ev(s, 'grab', b.i, c);
    }
    if (b.gold >= 0 && b.carryT <= 0 && canHold(s, c) && staticSup(s.spec, b.x, b.y) && s.spec.tiles[c] === E) dropGold(s, b, c);
  }

  const canHold = (s, c) => c >= 0 && c < s.spec.n && s.spec.tiles[c] === E && !s.gold[c] && !!s.spec.rest[c];

  // Gold a robot lets go of lands at `c` if a runner could get it there, otherwise back where the robot found it.
  function dropGold(s, b, c) {
    let at = canHold(s, c) ? c : canHold(s, b.gold) ? b.gold : -1;
    if (at < 0) {
      let best = 1e9;
      const W = s.W, ox = b.gold % W, oy = (b.gold / W) | 0;
      for (let k = 0; k < s.spec.n; k++) {
        if (!canHold(s, k)) continue;
        const d = Math.abs((k % W) - ox) + Math.abs(((k / W) | 0) - oy);
        if (d < best) { best = d; at = k; }
      }
    }
    s.gold[at] = 1;
    s.left++;
    s.carried--;
    b.gold = -1;
    ev(s, 'drop', b.i, at);
  }

  // Out of the hole on the side away from nobody: a hop up and over the edge (it waits while you stand on its head).
  function climbOut(s, b) {
    const W = s.W, x = b.x, y = b.y;
    if (y === 0) return false;
    for (const r of s.runners) if (r.how !== 'caught' && cellOf(s, r) === (y - 1) * W + x) return false; // you're on its head
    const t = target(s, b);
    const first = t && fx(t) < x ? -1 : 1;
    for (const d of [first, -first]) {
      const nx = x + d, ny = y - 1;
      if (!passable(s, nx, ny) || robotIn(s, ny * W + nx, b)) continue;
      if (s.runners.some((r) => r.how !== 'caught' && Math.abs(fx(r) - nx) < 1 && Math.abs(fy(r) - ny) < 1)) continue; // not right into you
      go(b, d, -1, 'climbout');
      ev(s, 'climbout', b.i);
      return true;
    }
    return false;
  }

  function respawnRobot(s, b) {
    const W = s.W;
    let cells = [];
    for (let y = 0; y < s.H && !cells.length; y++) {
      for (let x = 0; x < W; x++) {
        const c = y * W + x;
        if (passable(s, x, y) && !robotIn(s, c, b) && !s.gold[c]) cells.push(c);
      }
    }
    const far = cells.filter((c) => s.runners.every((r) => Math.abs(fx(r) - (c % W)) + Math.abs(fy(r) - ((c / W) | 0)) >= 5));
    if (far.length) cells = far;
    const c = cells.length ? cells[Math.floor(rnd(s) * cells.length)] : b.home;
    stop(b, c % W, (c / W) | 0);
    b.how = 'stand';
    b.gold = -1;
    b.waitT = 0.4;
    ev(s, 'respawn', b.i, c);
  }

  function target(s, b) {
    let best = null, bd = 1e9;
    for (const r of s.runners) {
      if (r.how === 'caught') continue;
      const d = Math.abs(fx(r) - b.x) + Math.abs(fy(r) - b.y) * 1.5;
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  }

  function decideRobot(s, b) {
    const x = b.x, y = b.y;
    if (!supported(s, x, y, b)) {
      go(b, 0, 1, 'fall');
      return true;
    }
    b.how = restingHow(s, x, y) === 'hole' ? 'stand' : restingHow(s, x, y);
    let r = target(s, b);
    if (!r) return false;
    // the title screen's ghost robots chase a mirror image of the runner, so they roam about without sitting on him
    if (s.opts.ghost) r = { x: s.W - 1 - r.x, y: r.y, tx: s.W - 1 - r.x, ty: r.y, p: 0, moving: false, how: 'stand' };
    const m = chase(s, b, r);
    if (!m) {
      b.waitT = 0.2;
      return false;
    }
    const t = tileAt(s, x, y), nt = tileAt(s, x + m[0], y + m[1]);
    let how = 'walk';
    if (m[1] === -1) how = 'climb';
    else if (m[1] === 1) how = ladderish(s, nt) || ladderish(s, t) ? 'climb' : 'fall';
    else if (t === BAR || nt === BAR) how = 'bar';
    go(b, m[0], m[1], how);
    return true;
  }

  // The robot's next step: breadth-first over where a robot can go, to the runner (or as close as it can get).
  // Robots don't know about holes: an open hole looks like a dip in the floor, so they walk right into it.
  function chase(s, b, r, wantPath) {
    const W = s.W, H = s.H, n = s.spec.n;
    const start = b.y * W + b.x, goal = cellOf(s, r);
    const first = new Int16Array(n).fill(-1), prev = new Int16Array(n).fill(-1);
    const seen = new Uint8Array(n);
    const q = [start];
    seen[start] = 1;
    let found = -1;
    const gx = goal % W, gy = (goal / W) | 0;
    let best = -1, bestScore = 1e9;
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi], x = c % W, y = (c / W) | 0;
      if (c === goal) { found = c; break; }
      const sc = Math.abs(x - gx) + Math.abs(y - gy) * 2;
      if (sc < bestScore && c !== start) { bestScore = sc; best = c; }
      const nb = [];
      const t = s.spec.tiles[c];
      if (y < H - 1 && !supported(s, x, y, b)) nb.push(c + W);
      else {
        if (passable(s, x - 1, y)) nb.push(c - 1);
        if (passable(s, x + 1, y)) nb.push(c + 1);
        if (y > 0 && ladderish(s, t) && passable(s, x, y - 1)) nb.push(c - W);
        if (y < H - 1 && passable(s, x, y + 1) && (ladderish(s, s.spec.tiles[c + W]) || ladderish(s, t) || t === BAR)) nb.push(c + W);
      }
      for (const k of nb) {
        if (seen[k]) continue;
        if (c === start && robotIn(s, k, b)) continue; // another robot is there now
        seen[k] = 1;
        prev[k] = c;
        first[k] = c === start ? k : first[c];
        q.push(k);
      }
    }
    const to = found >= 0 ? found : best;
    if (to < 0 || to === start || first[to] < 0) return null;
    if (wantPath) {
      const path = [];
      for (let c = to; c >= 0 && c !== start; c = prev[c]) path.push(c);
      return path.reverse();
    }
    const f = first[to];
    return [(f % W) - b.x, ((f / W) | 0) - b.y];
  }

  // ---------------------------------------------------------------- the solver
  // A rest state is a cell where a runner stands still (on a floor, a ladder, a bar or in a hole he dug), plus `h`: he's in an
  // open hole. A move is walk left / right, climb up / down (or let go of a bar), dig left / right then step into the hole,
  // or (in a hole) wait for it to fill and pop up. Falls happen inside a move. The hole a move digs is open while he drops
  // through it; any other hole counts as filled in (the replay waits for that). Gold is a bit mask; the exit ladders are
  // ladders once the mask is full. sim() follows the same rules as the game (decide / supported / canDig above).

  const ACTS = ['walkL', 'walkR', 'up', 'down', 'digL', 'digR', 'pop'];

  function sim(spec, st, act, ctx) {
    const { W, H, tiles: T, gi } = spec;
    let mask = st.mask, hole = -1;
    const x = st.x, y = st.y, c = y * W + x, t = T[c];
    const lad = (k) => T[k] === LADDER || (T[k] === EXIT && (ctx.open || mask === ctx.full));
    const solid = (k) => (T[k] === BRICK && k !== hole) || T[k] === STONE;
    const pass = (xx, yy) => xx >= 0 && xx < W && yy >= 0 && yy < H && !solid(yy * W + xx);
    const sup = (xx, yy) => {
      if (yy >= H - 1) return true;
      const k = yy * W + xx;
      if (T[k] === BAR || lad(k)) return true;
      return solid(k + W) || lad(k + W);
    };
    const visit = (xx, yy) => {
      const k = yy * W + xx;
      if (gi[k] >= 0) mask |= 1 << gi[k];
      if (ctx.touch) ctx.touch[k] = 1;
    };
    const fallFrom = (xx, yy) => {
      visit(xx, yy);
      while (!sup(xx, yy)) visit(xx, ++yy);
      return yy;
    };
    let nx = x, ny = y, nh = false;
    switch (act) {
      case 0: case 1: {
        const d = act === 0 ? -1 : 1;
        if (!pass(x + d, y)) return null;
        nx = x + d;
        ny = fallFrom(nx, y);
        break;
      }
      case 2:
        if (!lad(c) || y === 0 || !pass(x, y - 1)) return null;
        ny = fallFrom(x, y - 1);
        break;
      case 3:
        if (y >= H - 1 || !pass(x, y + 1)) return null;
        if (!(lad(c + W) || lad(c) || t === BAR)) return null;
        ny = fallFrom(x, y + 1);
        break;
      case 4: case 5: {
        const d = act === 4 ? -1 : 1, hx = x + d, hy = y + 1;
        if (t === BAR || hx < 0 || hx >= W || hy >= H) return null;
        const hc = hy * W + hx, ac = y * W + hx;
        if (T[hc] !== BRICK || T[ac] !== E) return null;
        if (gi[ac] >= 0 && !(mask & (1 << gi[ac]))) return null; // gold beside him: no digging under it
        hole = hc;
        nx = hx;
        ny = fallFrom(hx, y);
        nh = ny === hy;
        break;
      }
      case 6:
        if (!st.h || !pass(x, y - 1)) return null;
        ny = fallFrom(x, y - 1);
        break;
      default:
        return null;
    }
    return { x: nx, y: ny, h: nh, mask };
  }

  // Every rest state reachable from `from` (gold mask fixed): for the rest cells and the stuck helper.
  function reachFrom(spec, from, ctx) {
    const seen = new Uint8Array(spec.n * 2), q = [];
    const k0 = (from.y * spec.W + from.x) * 2 + (from.h ? 1 : 0);
    seen[k0] = 1;
    q.push({ x: from.x, y: from.y, h: !!from.h, mask: ctx.mask });
    let top = false;
    for (let qi = 0; qi < q.length; qi++) {
      const st = q[qi];
      if (st.y === 0) top = true;
      for (let a = 0; a < 7; a++) {
        const r = sim(spec, st, a, ctx);
        if (!r) continue;
        r.mask = ctx.mask;
        const k = (r.y * spec.W + r.x) * 2 + (r.h ? 1 : 0);
        if (seen[k]) continue;
        seen[k] = 1;
        q.push(r);
      }
    }
    return { seen, top };
  }

  // Can runner r still get some gold, or (exit open) the top? If a robot is carrying gold the answer is yes: it'll drop it.
  function reach(s, r) {
    if (s.sab === 'nostuck') return true; // sabotage: never say stuck
    if (s.carried > 0) return true;
    const spec = s.spec, touch = new Uint8Array(spec.n);
    let mask = 0;
    spec.goldList.forEach((c, i) => { if (!s.gold[c]) mask |= 1 << i; });
    const inHole = s.hole[r.y * s.W + r.x] === 2;
    const res = reachFrom(spec, { x: r.x, y: r.y, h: inHole }, { mask, full: -1, open: s.exitOpen, touch });
    touch[r.y * s.W + r.x] = 1;
    if (s.exitOpen) return res.top;
    for (let c = 0; c < spec.n; c++) if (s.gold[c] && touch[c]) return true;
    return false;
  }

  // Breadth-first over (rest state, gold mask): the fewest moves that get every bit of gold and then the top row.
  function solve(spec, opts = {}) {
    const G = spec.total, full = (1 << G) - 1, M = 1 << G, n = spec.n;
    if (G > 14) return { ok: false, reason: 'too much gold to check (14 at most)' };
    const N = n * 2 * M;
    const seen = new Uint8Array(N), prev = new Int32Array(N), how = new Uint8Array(N);
    const s0 = spec.starts[0], x0 = s0 % spec.W, y0 = (s0 / spec.W) | 0;
    if (!staticSup(spec, x0, y0)) return { ok: false, reason: 'the start is in mid-air' };
    const key = (st) => ((st.y * spec.W + st.x) * 2 + (st.h ? 1 : 0)) * M + st.mask;
    const start = { x: x0, y: y0, h: false, mask: 0 };
    const k0 = key(start);
    seen[k0] = 1;
    prev[k0] = -1;
    const q = [start], qk = [k0];
    const ctx = { full, open: false };
    let goal = -1, states = 0;
    const limit = opts.limit || 4e6;
    for (let qi = 0; qi < q.length && goal < 0; qi++) {
      const st = q[qi], k = qk[qi];
      if (++states > limit) return { ok: false, reason: 'search too big', states };
      for (let a = 0; a < 7; a++) {
        const r = sim(spec, st, a, ctx);
        if (!r) continue;
        const k2 = key(r);
        if (seen[k2]) continue;
        seen[k2] = 1;
        prev[k2] = k;
        how[k2] = a;
        if (r.mask === full && r.y === 0) { goal = k2; break; }
        q.push(r);
        qk.push(k2);
      }
    }
    if (goal < 0) return { ok: false, reason: 'no way to clear it', states };
    const moves = [];
    for (let k = goal; prev[k] !== -1; k = prev[k]) {
      const m = Math.floor(k / M), c = m >> 1;
      moves.push({ act: ACTS[how[k]], a: how[k], x: c % spec.W, y: (c / spec.W) | 0, h: !!(m & 1), mask: k % M });
    }
    moves.reverse();
    return { ok: true, moves, states, digs: moves.filter((m) => m.a === 4 || m.a === 5).length };
  }

  // A plain-text picture of a game (for the checks): robots r, runners 1 2, holes o, gold $.
  function draw(s) {
    const out = [];
    for (let y = 0; y < s.H; y++) {
      let line = '';
      for (let x = 0; x < s.W; x++) {
        const c = y * s.W + x;
        let ch = CHAR[s.spec.tiles[c]];
        if (ch === 'S' && !s.exitOpen) ch = ',';
        if (s.hole[c] === 2) ch = 'o';
        if (s.gold[c]) ch = '$';
        for (const b of s.robots) if (b.how !== 'out' && cellOf(s, b) === c) ch = 'r';
        for (const r of s.runners) if (cellOf(s, r) === c) ch = String(r.i + 1);
        line += ch;
      }
      out.push(line);
    }
    return out.join('\n');
  }

  Object.assign(TR, {
    E, BRICK, STONE, LADDER, BAR, EXIT, NONE, LEFT, RIGHT, UP, DOWN, TIERS, SCORE, TICK, ACTS, BUDDY_HOLE,

<script>
/* TT Treasure Runner: the headless checks (TR.check), run by tools/check.js in Node and by game.check() in the page.
   They drive js/rules.js only (no drawing), so they test the same rules the game plays by. Groups:
     levels   every level is well formed, the solver clears it, and its answer plays out through the real game (TR.step,
              robots off) on 🐣 EASY and 🔥 NORMAL, landing exactly where the solver said after every move
     holes    a dug hole opens, stays open for the tier's time, then fills; only bricks, never under a ladder or gold,
              never while falling or hanging; a runner inside pops up out of it when it fills
     moves    falling, ladders, bars, walls; → is +1 cell and ← is -1 on every level
     robots   a robot falls into a hole and is stuck, drops its gold on top, can be walked over, climbs out if the hole is
              still open, or pops back in at the top if it fills first; gold is never lost
     buddy    your brother's row of holes: in front of the nearest robot, never under you, gold, a ladder or a bar, open a
              while longer than yours; on a brick floor the robot drops in; every level with robots gets some
     trap     random play with robots on every level: nobody inside a wall, no state that lasts forever, a runner who can't
              move is told he's stuck (press R), and R always gives back the very start
   check({ sabotage }) proves the checks can fail: nofill, float, nobar, keepgold, trap, nostuck, restart, wall. */
(function () {
  'use strict';
  const TR = (typeof window !== 'undefined' ? window : globalThis).TR;
  const { LEFT, RIGHT, UP, DOWN, TICK } = TR;

  function group(name) {
    return { name, passed: 0, failed: 0, fails: [], ok(cond, msg) {
      if (cond) this.passed++;
      else {
        this.failed++;
        if (this.fails.length < 8) this.fails.push(msg);
      }
      return cond;
    } };
  }

  // a tiny level from rows (for the rule fixtures)
  const fixture = (rows, id = 'fixture') => TR.parse({ id, rows });
  const game = (rows, opts = {}) => {
    const s = TR.create(fixture(rows), Object.assign({ tier: 'normal', robots: true }, opts));
    if (!s.spec.total) s.exitOpen = false; // a fixture with no gold keeps its exit shut (or reaching the top row would win)
    return s;
  };
  const run = (s, secs, inp) => TR.step(s, secs, inp || [{ dir: 0, dig: 0 }]);
  const cell = (s, a) => a.y * s.W + a.x;

  // hold a direction until he's heading for cell (x, y), then let go and let him settle there
  function walkTo(s, inp, dir, x, y, max = 6) {
    const r = s.runners[0];
    inp[0].dir = dir;
    stepUntil(s, inp, () => (r.moving && r.tx === x && r.ty === y) || (!r.moving && r.x === x && r.y === y), max);
    inp[0].dir = 0;
    return stepUntil(s, inp, () => !r.moving, 2);
  }

  function stepUntil(s, inp, cond, max = 10) {
    for (let t = 0; t < max; t += TICK) {
      TR.step(s, TICK, inp);
      if (cond()) return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- levels

  // Play the solver's moves through the real game, one at a time, with keys held like a player would.
  function replay(spec, sol, tier, sab) {
    const s = TR.create(spec, { tier, players: 1, robots: false, sabotage: sab });
    const r = s.runners[0], inp = [{ dir: 0, dig: 0 }], W = spec.W;
    const rest = () => s.won || (TR.atRest(s, r) && r.how !== 'dig');
    const hold = (dir) => {
      inp[0].dir = dir;
      const moved = stepUntil(s, inp, () => r.moving || s.won, 1.5);
      inp[0].dir = 0;
      return moved && stepUntil(s, inp, rest, 6);
    };
    for (let i = 0; i < sol.moves.length; i++) {
      const m = sol.moves[i];
      const mine = r.y * W + r.x;
      // holes he isn't in fill back in before he goes on (the solver counts them as filled)
      stepUntil(s, inp, () => { for (let c = 0; c < spec.n; c++) if (s.hole[c] && c !== mine) return false; return true; }, 20);
      let ok = true;
      if (m.act === 'walkL') ok = hold(LEFT);
      else if (m.act === 'walkR') ok = hold(RIGHT);
      else if (m.act === 'up') ok = hold(UP);
      else if (m.act === 'down') ok = hold(DOWN);
      else if (m.act === 'digL' || m.act === 'digR') {
        const d = m.act === 'digL' ? -1 : 1;
        inp[0].dig = d;
        ok = stepUntil(s, inp, () => r.how === 'dig', 0.5) && stepUntil(s, inp, () => r.how !== 'dig', 1) && hold(d === -1 ? LEFT : RIGHT);
      } else if (m.act === 'pop') ok = stepUntil(s, inp, () => s.hole[mine] === 0 && rest(), 20);
      const inHole = s.hole[r.y * W + r.x] === 2;
      if (!ok || r.x !== m.x || r.y !== m.y || (inHole !== m.h && !s.won)) {
        return { ok: false, at: i, msg: `move ${i} ${m.act}: solver says ${m.x},${m.y}${m.h ? ' in a hole' : ''}, the game has ${r.x},${r.y}${inHole ? ' in a hole' : ''} (${r.how})\n${TR.draw(s)}` };
      }
      if (s.won) return { ok: i === sol.moves.length - 1, at: i, msg: 'won early', t: s.t };
    }
    return { ok: s.won, msg: s.won ? '' : 'played every move but did not win', t: s.t };
  }

  function checkLevels(g, opts) {
    const levels = TR.LEVELS.slice();
    if (opts.sabotage === 'wall') {
      // a level whose gold is sealed in stone
      levels.push({ id: 99, name: 'SEALED', rows: ['......S', '.1....S', '@@@@@@@', '@@$@@@@', '@@@@@@@'] });
    }
    g.ok(levels.length >= 30 || opts.sabotage === 'wall', `only ${levels.length} levels`);
    const ids = new Set();
    const rows = [];
    for (const lv of levels) {
      const spec = TR.parse(lv);
      const name = `level ${lv.id} ${lv.name}`;
      g.ok(!ids.has(lv.id), `${name}: the id is used twice`);
      ids.add(lv.id);
      g.ok(lv.rows.every((r) => r.length === spec.W), `${name}: rows of different lengths`);
      g.ok(spec.bad.length === 0, `${name}: unknown tiles ${spec.bad.join('')}`);
      g.ok(lv.rows.join('').split('1').length === 2, `${name}: needs exactly one 1`);
      g.ok(spec.W <= 24 && spec.H <= 14, `${name}: too big (${spec.W} x ${spec.H})`);
      g.ok(spec.total >= 1 && spec.total <= 12, `${name}: ${spec.total} gold (1 to 12)`);
      g.ok(spec.exits.some((c) => c < spec.W), `${name}: the exit ladder must reach the top row`);
      for (const c of spec.starts.concat(spec.robots)) g.ok(TR.staticSup(spec, c % spec.W, (c / spec.W) | 0), `${name}: a start in mid-air at ${c % spec.W},${(c / spec.W) | 0}`);
      const sol = TR.solve(spec);
      if (!g.ok(sol.ok, `${name}: the solver can't clear it (${sol.reason})`)) continue;
      for (const tier of ['easy', 'normal']) {
        const rp = replay(spec, sol, tier, opts.sabotage);
        g.ok(rp.ok, `${name} on ${tier}: ${rp.msg}`);
      }
      // the stuck helper agrees: nobody is stuck at the start
      const s = TR.create(spec, { tier: 'easy', robots: false });
      g.ok(TR.reach(s, s.runners[0]), `${name}: the stuck helper says stuck at the start`);
      rows.push({ id: lv.id, moves: sol.moves.length, digs: sol.digs, gold: spec.total, robots: spec.robots.length });
    }
    g.summary = rows;
  }

  // ---------------------------------------------------------------- holes

  function checkHoles(g, opts) {
    const sab = opts.sabotage;
    const A = ['S........', 'S..1.....', '@#######@', '@@@@@@@@@'];
    for (const tier of ['easy', 'normal']) {
      const s = game(A, { tier, robots: false, sabotage: sab });
      const r = s.runners[0], cfg = s.cfg, h = 2 * s.W + 4;
      const inp = [{ dir: 0, dig: 1 }];
      run(s, TICK, inp);
      g.ok(r.how === 'dig' && s.hole[h] === 1, `${tier}: X starts a dig at his lower right`);
      g.ok(!TR.passable(s, 4, 2), `${tier}: a brick being dug is still solid`);
      stepUntil(s, inp, () => s.hole[h] === 2, 2);
      g.ok(Math.abs(s.t - cfg.dig) < 0.04, `${tier}: the hole opens after the dig (${s.t.toFixed(2)} s, wants ${cfg.dig})`);
      g.ok(TR.passable(s, 4, 2), `${tier}: an open hole is passable`);
      const opened = s.t;
      stepUntil(s, inp, () => s.hole[h] === 0, cfg.hole + 2);
      const open = s.t - opened;
      g.ok(Math.abs(open - cfg.hole) < 0.04, `${tier}: the hole stays open ${cfg.hole} s (was ${open.toFixed(2)} s)`);
      g.ok(!TR.passable(s, 4, 2), `${tier}: then the brick is back`);
      g.ok(tier === 'normal' || cfg.hole > TR.TIERS.normal.hole, 'EASY holes stay open longer than NORMAL ones');
    }
    // what you can't dig
    {
      const s = game(['.........', '.H.1$....', '@######@@', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0];
      g.ok(!TR.canDig(s, r, 1), 'no digging under gold');
      g.ok(TR.canDig(s, r, -1) === true, 'a brick with nothing above it can be dug');
      const s2 = game(['.........', '..H1.....', '@######@@', '@@@@@@@@@'], { robots: false, sabotage: sab });
      g.ok(!TR.canDig(s2, s2.runners[0], -1), 'no digging under a ladder');
      const s3 = game(['.........', '.....1...', '@@@@@@@@@', '@@@@@@@@@'], { robots: false, sabotage: sab });
      g.ok(!TR.canDig(s3, s3.runners[0], 1) && !TR.canDig(s3, s3.runners[0], -1), 'no digging stone');
      const s4 = game(['.........', '..-1-....', '..#.#....', '@@@@@@@@@'], { robots: false, sabotage: sab });
      g.ok(!TR.canDig(s4, s4.runners[0], 1), 'no digging while hanging from a bar');
      const s5 = game(['...1.....', '.........', '.........', '@@@@@@@@@'], { robots: false, sabotage: sab });
      run(s5, TICK);
      g.ok(s5.runners[0].moving && !TR.canDig(s5, s5.runners[0], 1), 'no digging while falling');
    }
    // in a hole when it fills: up and out, never inside the brick
    for (const tier of ['easy', 'normal']) {
      const s = game(['S........', 'S..1.....', '@#######@', '@@@@@@@@@'], { tier, robots: false, sabotage: sab });
      const r = s.runners[0], h = 2 * s.W + 4, inp = [{ dir: 0, dig: 1 }];
      stepUntil(s, inp, () => s.hole[h] === 2, 2);
      inp[0].dir = RIGHT;
      stepUntil(s, inp, () => r.moving, 1);
      inp[0].dir = 0;
      stepUntil(s, inp, () => TR.atRest(s, r), 3);
      g.ok(cell(s, r) === h, `${tier}: he walks into his own hole and stands in it`);
      inp[0].dir = UP;
      run(s, 0.5, inp);
      g.ok(cell(s, r) === h, `${tier}: ↑ in a hole (no ladder) does nothing`);
      inp[0].dir = 0;
      stepUntil(s, inp, () => s.hole[h] === 0, s.cfg.hole + 1);
      run(s, 0.1, inp);
      g.ok(cell(s, r) === h - s.W && TR.passable(s, r.x, r.y), `${tier}: when it fills he pops up on top of it (at ${r.x},${r.y})`);
      g.ok(s.events.some((e) => e.type === 'pop'), `${tier}: a pop`);
    }
  }

  // ---------------------------------------------------------------- moves

  function checkMoves(g, opts) {
    const sab = opts.sabotage;
    // falling: from the top of a shaft to the floor
    {
      const s = game(['...1.....', '.........', '.........', '.........', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0];
      stepUntil(s, [{ dir: 0 }], () => TR.atRest(s, r) && r.y > 0, 3);
      g.ok(r.y === 3 && r.x === 3, `with nothing under him he falls to the floor (at ${r.x},${r.y})`);
      g.ok(Math.abs(s.t - 3 / s.cfg.fall) < 0.1, `falling takes ${(3 / s.cfg.fall).toFixed(2)} s for 3 cells (took ${s.t.toFixed(2)})`);
    }
    // ladders: up only on a ladder; standing on top; down again
    {
      const s = game(['.........', '...H.....', '...H.....', '..1H.....', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0], inp = [{ dir: UP }];
      run(s, 0.5, inp);
      g.ok(r.y === 3, '↑ off a ladder does nothing');
      walkTo(s, inp, RIGHT, 3, 3);
      walkTo(s, inp, UP, 3, 0);
      g.ok(r.y === 0 && r.x === 3, `↑ climbs to the top of the ladder and stands on it (at ${r.x},${r.y})`);
      inp[0].dir = 0;
      run(s, 0.5, inp);
      g.ok(r.y === 0, 'on top of a ladder he stays put');
      walkTo(s, inp, DOWN, 3, 3);
      g.ok(r.y === 3, '↓ climbs back down');
    }
    // bars: walk onto one and hang; along it; ↓ lets go; falling past a bar grabs it
    {
      const s = game(['.........', '.1-----..', '@@.......', '.........', '.........', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0], inp = [{ dir: 0 }];
      walkTo(s, inp, RIGHT, 4, 1);
      g.ok(r.x === 4 && r.y === 1 && r.how === 'bar', `along a bar he hangs on (at ${r.x},${r.y}, ${r.how})`);
      inp[0].dir = 0;
      run(s, 0.5, inp);
      g.ok(r.y === 1, 'hanging still, he doesn\'t fall');
      inp[0].dir = DOWN;
      run(s, TICK * 2, inp);
      inp[0].dir = 0;
      stepUntil(s, inp, () => TR.atRest(s, r), 2);
      g.ok(r.y === 4, `↓ lets go and he drops to the floor (at ${r.x},${r.y})`);
      const s2 = game(['...1.....', '.........', '..---....', '.........', '@@@@@@@@@'], { robots: false, sabotage: sab });
      stepUntil(s2, [{ dir: 0 }], () => TR.atRest(s2, s2.runners[0]) && s2.t > 0.1, 2);
      g.ok(s2.runners[0].y === 2 && s2.runners[0].how === 'bar', `falling past a bar he grabs it (at y ${s2.runners[0].y})`);
    }
    // walls and stone stop you
    {
      const s = game(['.........', '..#1@....', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0];
      run(s, 0.6, [{ dir: LEFT }]);
      g.ok(r.x === 3, 'a brick wall stops you');
      run(s, 0.6, [{ dir: RIGHT }]);
      g.ok(r.x === 3, 'a stone wall stops you');
    }
    // turning round half way through a step
    {
      const s = game(['.........', '....1....', '@@@@@@@@@'], { robots: false, sabotage: sab });
      const r = s.runners[0], inp = [{ dir: RIGHT }];
      run(s, 0.1, inp);
      const half = r.moving && r.tx === 5;
      inp[0].dir = LEFT;
      run(s, TICK, inp);
      inp[0].dir = 0;
      stepUntil(s, inp, () => !r.moving, 1);
      g.ok(half && r.x === 4 && !r.moving, `→ then ← half way turns him round, back where he was (at ${r.x})`);
    }
    // → is one cell to the right and ← one to the left, on every level (where there's room)
    for (const lv of TR.LEVELS) {
      const spec = TR.parse(lv);
      for (const [dir, dx] of [[RIGHT, 1], [LEFT, -1]]) {
        const s = TR.create(spec, { tier: 'normal', robots: false, sabotage: sab });
        const r = s.runners[0], x0 = r.x;
        if (!TR.passable(s, x0 + dx, r.y)) continue;
        run(s, TICK * 2, [{ dir }]);
        stepUntil(s, [{ dir: 0 }], () => !r.moving && r.x !== x0, 1);
        g.ok(r.x === x0 + dx || (r.y > (spec.starts[0] / spec.W | 0) && r.x === x0 + dx), `level ${lv.id}: ${dir === RIGHT ? '→' : '←'} moved him to x ${r.x} from ${x0}`);
      }
    }
  }

  // ---------------------------------------------------------------- robots

  const goldSum = (s) => {
    let map = 0;
    for (let c = 0; c < s.spec.n; c++) map += s.gold[c];
    return { ok: map === s.left && s.left + s.carried + s.got === s.spec.total, map };
  };

  function checkRobots(g, opts) {
    const sab = opts.sabotage;
    const rows = ['S..............', 'S.1......$...R.', '@##############', '@@@@@@@@@@@@@@@'];
    for (const tier of ['easy', 'normal']) {
      const s = game(rows, { tier, sabotage: sab });
      s.cfg.pick = 1; // this robot always picks the gold up
      const r = s.runners[0], b = s.robots[0], inp = [{ dir: 0, dig: 1 }];
      const h = 2 * s.W + 3;
      // wait for it to come with the gold, then dig in front of you
      const got = stepUntil(s, [{ dir: 0 }], () => b.gold >= 0, 8);
      g.ok(got, `${tier}: the robot picks up gold it walks over`);
      g.ok(goldSum(s).ok, `${tier}: carried gold is still counted`);
      stepUntil(s, [{ dir: 0 }], () => b.x <= 7, 8);
      run(s, TICK, inp);
      const stuck = stepUntil(s, [{ dir: 0 }], () => b.how === 'hole', 6);
      g.ok(stuck && cell(s, b) === h, `${tier}: it falls into the hole and is stuck (at ${b.x},${b.y}, ${b.how})`);
      g.ok(b.gold < 0 && s.gold[h - s.W] === 1, `${tier}: it drops its gold on top of the hole`);
      g.ok(goldSum(s).ok, `${tier}: no gold lost`);
      const at = cell(s, b);
      run(s, Math.min(1, s.cfg.stuck - 0.3), [{ dir: 0 }]);
      g.ok(cell(s, b) === at && b.how === 'hole', `${tier}: stuck, it doesn't move`);
      // walk over it: right across its head, no fall, no catch
      const lives = s.lives;
      walkTo(s, inp, RIGHT, 4, 1);
      g.ok(r.x === 4 && r.y === 1 && s.lives === lives && r.how !== 'caught', `${tier}: you can walk over a stuck robot (at ${r.x},${r.y})`);
      g.ok(s.got === 1, `${tier}: and pick up the gold it dropped`);
      // run away, then it climbs out if the hole's still open (NORMAL), or the hole fills and it pops back at the top
      walkTo(s, inp, RIGHT, 13, 1);
      const done = stepUntil(s, inp, () => b.how !== 'hole' && b.how !== 'climbout', s.cfg.hole + 2);
      if (s.cfg.stuck < s.cfg.hole) {
        g.ok(done && b.how !== 'out' && b.y === 1, `${tier}: with the hole still open it climbs out (${b.how} at ${b.x},${b.y})`);
      }
    }
    // the hole fills before it can climb out: it pops back in at the top
    for (const tier of ['easy', 'normal']) {
      const s = game(['...............', 'S.1..........R.', '@##############', '@@@@@@@@@@@@@@@'], { tier, sabotage: sab });
      const b = s.robots[0], h = 2 * s.W + 3;
      // dig late, so the hole is near its end when the robot drops in
      stepUntil(s, [{ dir: 0 }], () => b.x <= 4 + Math.ceil(s.cfg.robot * 0.6), 10);
      run(s, TICK, [{ dir: 0, dig: 1 }]);
      stepUntil(s, [{ dir: 0 }], () => b.how === 'hole', 6);
      // keep it from climbing out: stand on its head
      const r = s.runners[0];
      const inp = [{ dir: 0 }];
      walkTo(s, inp, RIGHT, 3, 1);
      g.ok(r.x === 3 && r.y === 1, `${tier}: he stands on the stuck robot's head (at ${r.x},${r.y})`);
      const score = s.score;
      const trapped = stepUntil(s, inp, () => b.how === 'out', s.cfg.hole + 1);
      g.ok(trapped && s.hole[h] === 0, `${tier}: the hole fills with the robot in it and it's puffed away (${b.how})`);
      g.ok(s.score - score >= TR.SCORE.trap, `${tier}: that scores ${TR.SCORE.trap}`);
      const back = stepUntil(s, inp, () => b.how !== 'out', s.cfg.respawn + 1);
      g.ok(back && b.y === 0, `${tier}: it pops back in at the top (at ${b.x},${b.y})`);
      g.ok(TR.passable(s, b.x, b.y), `${tier}: in an open cell`);
    }
  }

  // ---------------------------------------------------------------- your brother's holes

  function checkBuddy(g, opts) {
    const sab = opts.sabotage;
    // a robot coming along a brick floor: he digs in front of it, the holes open, last longer than yours, and it drops in
    for (const tier of ['easy', 'normal']) {
      const s = game(['S...............', 'S.1..........R..', '@###############', '@@@@@@@@@@@@@@@@'], { tier, sabotage: sab });
      const b = s.robots[0], r = s.runners[0];
      run(s, 0.4);
      const plan = TR.buddyPlan(s);
      g.ok(plan.robot === 0 && plan.cells.length === 3, `${tier}: a row of three holes for the robot (${plan.cells.length})`);
      g.ok(plan.cells.every((c) => (c % s.W) < b.x && (c % s.W) > r.x && ((c / s.W) | 0) === b.y + 1), `${tier}: in the floor between the robot and you`);
      plan.cells.forEach((c) => TR.digAt(s, c));
      g.ok(plan.cells.every((c) => s.hole[c] === 1), `${tier}: the bricks start to crumble`);
      run(s, s.cfg.dig + TICK);
      g.ok(plan.cells.every((c) => s.hole[c] === 2), `${tier}: and open`);
      g.ok(plan.cells.every((c) => Math.abs(s.holeT[c] - s.cfg.hole * TR.BUDDY_HOLE) < 0.1), `${tier}: your brother's holes stay open ${TR.BUDDY_HOLE} times as long`);
      const got = stepUntil(s, [{ dir: 0 }], () => b.how === 'hole', s.cfg.hole * TR.BUDDY_HOLE);
      g.ok(got && plan.cells.includes(b.y * s.W + b.x), `${tier}: the robot drops into one`);
      g.ok(r.how !== 'caught', `${tier}: and you weren't tickled`);
    }
    // never under you, never under gold, a ladder or a bar; and nothing to do when there are no robots
    {
      const s = game(['S...........', 'S.1$H-...R..', '@###########', '@@@@@@@@@@@@'], { sabotage: sab });
      run(s, 0.3);
      const plan = TR.buddyPlan(s);
      for (const c of plan.cells) {
        const above = s.spec.tiles[c - s.W];
        g.ok(above === TR.E && !s.gold[c - s.W] && TR.cellOf(s, s.runners[0]) !== c - s.W, `no hole under you, gold, a ladder or a bar (cell ${c % s.W},${(c / s.W) | 0})`);
      }
      const n = game(['S.....', 'S.1...', '@#####', '@@@@@@'], { sabotage: sab });
      g.ok(TR.buddyPlan(n).robot === -1, 'no robots: no holes');
    }
    // every level with robots: he finds bricks to dig for the nearest one
    const st = { levels: 0, withHoles: 0, trappedOrDropped: 0 };
    for (const lv of TR.LEVELS) {
      for (const tier of ['easy', 'normal']) {
        const s = TR.create(TR.parse(lv), { tier, lives: 99, sabotage: sab });
        if (!s.robots.length) continue;
        st.levels++;
        run(s, 1);
        const plan = TR.buddyPlan(s);
        if (plan.cells.length) st.withHoles++;
        g.ok(plan.cells.length >= 1 && plan.cells.length <= 3, `level ${lv.id} ${tier}: holes for the nearest robot (${plan.cells.length})`);
        g.ok(plan.cells.every((c) => TR.holeOK(s, c % s.W, (c / s.W) | 0)), `level ${lv.id} ${tier}: every hole is a brick he can dig`);
        plan.cells.forEach((c) => TR.digAt(s, c));
        let hit = false;
        for (let t = 0; t < s.cfg.hole * TR.BUDDY_HOLE + s.cfg.dig && !hit; t += TICK) {
          TR.step(s, TICK, [{ dir: 0 }]);
          hit = s.robots.some((b) => plan.cells.includes(TR.cellOf(s, b)) && b.how !== 'out');
        }
        if (hit) st.trappedOrDropped++;
      }
    }
    g.stats = st;
  }

  // ---------------------------------------------------------------- trap and restart

  const snap = (s) => JSON.stringify({
    hole: Array.from(s.hole), gold: Array.from(s.gold), left: s.left, carried: s.carried, got: s.got, exit: s.exitOpen, score: s.score, won: s.won, over: s.over,
    runners: s.runners.map((r) => [r.x, r.y, r.tx, r.ty, r.p, r.how, r.moving, r.digT]), robots: s.robots.map((b) => [b.x, b.y, b.how, b.gold, b.moving]),
  });

  // Could he do anything at all? (a step, a climb, a drop, a dig, or a hole that will spit him out)
  function canAct(s, r) {
    const x = r.x, y = r.y, t = s.spec.tiles[y * s.W + x];
    if (s.hole[y * s.W + x] === 2) return true;
    for (const d of [-1, 1]) if (TR.passable(s, x + d, y) || TR.canDig(s, r, d)) return true;
    if (TR.ladderish(s, t) && y > 0 && TR.passable(s, x, y - 1)) return true;
    if (y < s.H - 1 && TR.passable(s, x, y + 1) && (TR.ladderish(s, s.spec.tiles[(y + 1) * s.W + x]) || TR.ladderish(s, t) || t === TR.BAR)) return true;
    return false;
  }

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function checkTrap(g, opts) {
    const rand = rng(opts.seed || 7);
    const stats = { seconds: 0, immobile: 0, told: 0, caught: 0, pops: 0, restarts: 0, wins: 0 };
    g.stats = stats;
    const secs = opts.quick ? 12 : 40;
    for (const lv of TR.LEVELS) {
      const spec = TR.parse(lv);
      for (const tier of ['easy', 'normal']) {
        const players = lv.id % 3 === 0 ? 2 : 1;
        let s = TR.create(spec, { tier, players, seed: lv.id * 31 + (tier === 'easy' ? 1 : 2), lives: 99, sabotage: opts.sabotage });
        const fresh = snap(TR.create(spec, { tier, players, seed: lv.id * 31 + (tier === 'easy' ? 1 : 2), lives: 99 }));
        const inp = s.runners.map(() => ({ dir: 0, dig: 0 }));
        const hold = s.runners.map(() => 0);
        const since = s.runners.map(() => ({ how: '', t: 0, still: 0 }));
        let bad = 0;
        const name = `level ${lv.id} ${tier}`;
        for (let t = 0; t < secs && bad < 3; t += TICK) {
          s.runners.forEach((r, i) => {
            hold[i] -= TICK;
            if (hold[i] <= 0) {
              hold[i] = 0.1 + rand() * 0.6;
              inp[i].dir = rand() < 0.15 ? 0 : 1 + Math.floor(rand() * 4);
              if (rand() < 0.2) inp[i].dig = rand() < 0.5 ? -1 : 1;
            }
          });
          TR.step(s, TICK, inp);
          const digs = s.events.filter((e) => e.type === 'dig').map((e) => e.a);
          for (const e of s.events) {
            if (e.type === 'caught') stats.caught++;
            if (e.type === 'pop') stats.pops++;
          }
          s.events.length = 0;
          stats.seconds += TICK;
          if (s.won) { // start again and keep going
            stats.wins++;
            s = TR.restart(s);
            continue;
          }
          if (!g.ok(goldSum(s).ok, `${name}: gold miscounted at ${t.toFixed(1)} s`)) bad++;
          s.runners.forEach((r, i) => {
            const cx = TR.cellOf(s, r) % s.W, cy = (TR.cellOf(s, r) / s.W) | 0;
            if (r.how !== 'caught' && !g.ok(TR.passable(s, cx, cy), `${name}: runner ${i + 1} inside a wall at ${cx},${cy} (${r.how}) at ${t.toFixed(1)} s\n${TR.draw(s)}`)) bad++;
            const sn = since[i];
            if (r.how !== sn.how || digs.includes(i)) { sn.how = r.how; sn.t = 0; }
            sn.t += TICK;
            const limit = r.how === 'caught' ? s.cfg.caught + 0.05 : r.how === 'dig' ? s.cfg.dig + 0.05 : 1e9;
            if (!g.ok(sn.t <= limit, `${name}: runner ${i + 1} stuck in '${r.how}' for ${sn.t.toFixed(2)} s`)) bad++;
            // can't move at all: within a moment the game must say "stuck? press R"
            if (TR.atRest(s, r) && !canAct(s, r)) sn.still += TICK;
            else sn.still = 0;
            if (sn.still > 1.2 && sn.still <= 1.2 + TICK) {
              stats.immobile++;
              if (r.stuck) stats.told++;
            }
            if (sn.still > 1.2 && !g.ok(r.stuck, `${name}: runner ${i + 1} can't move at ${r.x},${r.y} and isn't told he's stuck\n${TR.draw(s)}`)) bad++;
          });
          for (const b of s.robots) {
            if (b.how === 'out') continue;
            const c = TR.cellOf(s, b);
            if (!g.ok(TR.passable(s, c % s.W, (c / s.W) | 0), `${name}: a robot inside a wall at ${c % s.W},${(c / s.W) | 0}`)) bad++;
          }
          // now and then: R, and it must be the very start again
          if (rand() < 0.002) {
            stats.restarts++;
            const n = TR.restart(s);
            if (!g.ok(snap(n) === fresh, `${name}: R at ${t.toFixed(1)} s didn't give back the start`)) bad++;
            if (rand() < 0.5) s = n;
          }
        }
        const n = TR.restart(s);
        g.ok(snap(n) === fresh, `${name}: R after play didn't give back the start`);
        g.ok(n.lives === s.lives, `${name}: R keeps your lives`);
      }
    }
    // the stuck helper, on purpose: shut in a steel box (no move at all), and in a room with the gold out of reach
    const cases = [
      ['in a steel box', ['S.....', 'S..$..', '@@@@@@', '@@1@@@', '@@@@@@']],
      ['shut in a room, gold out of reach', ['S......', 'S..$...', '@@@@@@@', '@.1...@', '@@@@@@@']],
      ['fell down a pit he can\'t climb out of', ['S.......', 'S1..$...', '@@.@@@@@', '@@.@@@@@', '@@.@@@@@', '@@@@@@@@']],
    ];
    for (const [what, rows] of cases) {
      const s = game(rows, { robots: false, sabotage: opts.sabotage });
      const r = s.runners[0];
      if (what.startsWith('fell')) {
        TR.step(s, 0.3, [{ dir: RIGHT }]);
        stepUntil(s, [{ dir: 0 }], () => TR.atRest(s, r), 3);
      }
      run(s, 1.1);
      g.ok(r.stuck, `${what}: the game says he's stuck (so "press R" shows)`);
      const n = TR.restart(s);
      g.ok(!n.runners[0].stuck && n.runners[0].home === r.home, `${what}: R puts him back at the start`);
    }
    {
      const s = game(['S........', 'S.1....$.', '@@@@@@@@@'], { robots: false, sabotage: opts.sabotage });
      run(s, 1.1);
      g.ok(!s.runners[0].stuck, 'with the gold in reach he is not stuck');
    }
  }

  // ---------------------------------------------------------------- all of it

  function check(opts = {}) {
    const t0 = Date.now();
    const order = [['levels', checkLevels], ['holes', checkHoles], ['moves', checkMoves], ['robots', checkRobots], ['buddy', checkBuddy], ['trap', checkTrap]];
    const out = { ok: true, groups: {} };
    for (const [name, fn] of order) {
      if (opts.only && opts.only !== name) continue;
      const g = group(name);
      try {
        fn(g, opts);
      } catch (e) {
        g.ok(false, `${name} threw: ${e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e}`);
      }
      out.groups[name] = { passed: g.passed, failed: g.failed, fails: g.fails };
      if (g.stats) out.groups[name].stats = g.stats;
      if (g.summary) out.groups[name].levels = g.summary.map((l) => `${l.id}: ${l.moves} moves, ${l.digs} digs, ${l.gold} gold, ${l.robots} robots`).join(' · ');
      if (g.failed) {
        out.ok = false;
        if (opts.sabotage) break; // a sabotaged run stops at the first group that fails
      }
    }
    out.sabotage = opts.sabotage || null;
    out.ms = Date.now() - t0;
    return out;
  }

  TR.check = check;
  TR.replay = replay;
})();

</script>
<script>
/* TT Treasure Runner: the game's own sounds, built on Kit.sound.tone / hiss (all synthesised, no files).
   TR.sfx.kit(name, ...args) plays a kit effect; the rest are ours. Every call is a silent no-op until Kit.sound.init() has
   run from the first tap or key, and Kit.sound mutes them all with the page's one sound switch. */
(function () {
  'use strict';
  const TR = window.TR;
  const S = Kit.sound;
  const tone = (o) => S.tone(o);
  const hiss = (o) => S.hiss(o);

  TR.sfx = {
    kit(name, ...args) {
      if (S[name]) S[name](...args);
    },
    // a footstep, a little higher every other step
    step(odd) { tone({ type: 'triangle', f: odd ? 320 : 270, to: 190, dur: 0.04, vol: 0.035 }); },
    // a rung of a ladder or a bar: a soft clink
    rung(odd) { tone({ type: 'triangle', f: odd ? 880 : 784, dur: 0.05, vol: 0.03 }); },
    // the spade chops a brick: a crunch and a thud
    dig() {
      hiss({ filter: 'bandpass', f: 900, to: 300, q: 1.4, dur: 0.22, vol: 0.12 });
      tone({ type: 'square', f: 120, to: 70, dur: 0.14, vol: 0.07, lp: 700 });
    },
    // a hole fills back in: a bouncy pop
    fill() { tone({ type: 'triangle', f: 260, to: 520, dur: 0.12, vol: 0.06 }); },
    // gold: the kit's coin, brighter with each one
    gold(n) { S.coin(n); },
    // the last gold: the exit ladder grows up with a rising sparkle
    exit() {
      [523, 659, 784, 1046, 1318].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.09, dur: 0.22, vol: 0.09 }));
