      hiss({ filter: 'highpass', f: 6000, dur: 0.6, vol: 0.05, at: 0.1 });
    },
    // you fall / land
    fall() { tone({ type: 'sine', f: 700, to: 300, dur: 0.25, vol: 0.04 }); },
    land() { tone({ type: 'triangle', f: 140, to: 90, dur: 0.08, vol: 0.07 }); },
    // a robot drops into a hole: boing and a whirr winding down
    stuck() {
      tone({ type: 'sine', f: 420, to: 160, dur: 0.3, vol: 0.1 });
      tone({ type: 'sawtooth', f: 220, to: 60, dur: 0.6, vol: 0.03, lp: 900, at: 0.15 });
    },
    // the hole fills on a robot: AH-AH-CHOO! and it floats away
    sneeze() {
      tone({ type: 'triangle', f: 520, to: 700, dur: 0.18, vol: 0.06 });
      tone({ type: 'triangle', f: 600, to: 820, dur: 0.18, vol: 0.06, at: 0.22 });
      hiss({ filter: 'bandpass', f: 3000, to: 800, q: 0.8, dur: 0.3, vol: 0.18, at: 0.48 });
      tone({ type: 'sine', f: 600, to: 1400, dur: 0.8, vol: 0.04, at: 0.6 });
    },
    // a robot drops back in at the top
    boing() { tone({ type: 'sine', f: 200, to: 700, dur: 0.18, vol: 0.06 }); tone({ type: 'sine', f: 700, to: 300, dur: 0.15, vol: 0.05, at: 0.18 }); },
    // a robot climbs out of its hole
    climb() { tone({ type: 'square', f: 300, to: 600, dur: 0.15, vol: 0.03, lp: 1500 }); },
    // a robot picks up gold: a cheeky bleep-bloop
    grab() { tone({ type: 'square', f: 660, dur: 0.06, vol: 0.03, lp: 2000 }); tone({ type: 'square', f: 440, dur: 0.08, vol: 0.03, lp: 2000, at: 0.07 }); },
    // tickled! a run of giggly blips
    giggle() {
      for (let i = 0; i < 7; i++) tone({ type: 'triangle', f: 900 + (i % 2) * 220 - i * 30, dur: 0.06, vol: 0.06, at: i * 0.075 });
    },
    // popped up out of a filled hole
    pop() { tone({ type: 'sine', f: 300, to: 900, dur: 0.12, vol: 0.08 }); },
    // menus
    tick() { tone({ type: 'square', f: 1200, dur: 0.025, vol: 0.025, lp: 3000 }); },
    // can't do that
    nope() { tone({ f: 200, dur: 0.06, vol: 0.05 }); },
    // READY! GO!
    beep(go) { tone({ type: 'square', f: go ? 1046 : 523, dur: go ? 0.3 : 0.12, vol: 0.05, lp: 3200 }); },
    // the level's done: a fanfare
    win() {
      [523, 659, 784].forEach((f) => tone({ type: 'triangle', f: f * 2, dur: 0.6, vol: 0.07 }));
      hiss({ filter: 'highpass', f: 6000, dur: 0.5, vol: 0.05 });
      [1046, 1318, 1568, 2093].forEach((f, i) => tone({ type: 'triangle', f, at: 0.5 + i * 0.12, dur: 0.25, vol: 0.08 }));
    },
    // out of lives: a soft wah-wah, never harsh
    over() { [392, 370, 349, 311].forEach((f, i) => tone({ type: 'triangle', f, at: i * 0.22, dur: i === 3 ? 0.5 : 0.22, vol: 0.08 })); },
    // your brother pops in (and out)
    hello() {
      tone({ f: 300, to: 900, dur: 0.12, vol: 0.09 });
      hiss({ f: 2000, to: 6000, dur: 0.15, vol: 0.04 });
    },
    // the brother's holes: a quick chop each
    zap(i) { tone({ type: 'triangle', f: 500 + i * 120, to: 300, dur: 0.1, vol: 0.06 }); hiss({ filter: 'bandpass', f: 1200, q: 1, dur: 0.1, vol: 0.06 }); },
    // the high five: a clap
    clap() {
      hiss({ filter: 'bandpass', f: 1500, q: 0.8, dur: 0.09, vol: 0.2 });
      hiss({ filter: 'highpass', f: 3000, dur: 0.05, vol: 0.09, at: 0.01 });
    },
  };
})();

</script>
<script>
/* TT Treasure Runner: effects (from TT Box Push, by way of TT Slide Escape).
   TR.fx.flyers(scene): emoji sprites that fly, spin and fade in a 3D scene (stars, 💥, ✌️, treats).
   TR.fx.bursts(scene): comic "ACHOO!" / "BOOP!" starbursts that pop and fade.
   TR.fx.overlay: confetti and emoji on the 2D canvas over the page, in screen pixels (confetti for a win). */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const { makeCanvas, toTexture, emojiTexture, rand, pick, FONT } = Kit.gfx;

  // ---------------------------------------------------------------- 3D emoji flyers

  function flyers(scene, max = 48) {
    const pool = [];
    for (let i = 0; i < max; i++) {
      const s = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, depthTest: false, transparent: true }));
      s.visible = false;
      s.renderOrder = 20;
      scene.add(s);
      pool.push({ s, life: 0, age: 0, vx: 0, vy: 0, vz: 0, spin: 0, g: 0, size: 1 });
    }
    let next = 0;
    return {
      // emoji at (x, y, z), velocity (vx, vy) in m/s, size in m, life in s, spin in rad/s, gravity in m/s²
      add(emoji, x, y, z, vx, vy, size, life, spin = 0, g = 6, vz = 0) {
        const f = pool[next];
        next = (next + 1) % max;
        f.s.material.map = emojiTexture(emoji);
        f.s.material.needsUpdate = true;
        f.s.material.rotation = 0;
        f.s.position.set(x, y, z);
        f.s.scale.setScalar(size);
        f.s.visible = true;
        Object.assign(f, { life, age: 0, vx, vy, vz, spin, g, size });
        return f;
      },
      update(dt) {
        for (const f of pool) {
          if (!f.s.visible) continue;
          f.age += dt;
          if (f.age >= f.life) {
            f.s.visible = false;
            continue;
          }
          f.vy -= f.g * dt;
          f.s.position.x += f.vx * dt;
          f.s.position.y += f.vy * dt;
          f.s.position.z += f.vz * dt;
          f.s.material.rotation += f.spin * dt;
          const u = f.age / f.life;
          const pop = Math.min(1, f.age / 0.12);
          f.s.scale.setScalar(f.size * (0.5 + 0.5 * pop));
          f.s.material.opacity = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
        }
      },
      clear() {
        for (const f of pool) f.s.visible = false;
      },
    };
  }

  // ---------------------------------------------------------------- comic starbursts

  const burstCache = {};
  // The word is translated when drawn (ACHOO! has its 中文 too), and cached per language.
  function burstTexture(en, fill = '#ffd400', ink = '#e8372c') {
    const word = Kit.lang ? Kit.lang.t(en) : en;
    const key = word + fill + ink;
    if (burstCache[key]) return burstCache[key];
    const [c, g] = makeCanvas(256, 256);
    const spikes = 12;
    g.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      const r = i % 2 ? 78 : 122 - (i % 4 === 0 ? 0 : 10);
      g.lineTo(128 + Math.cos(a) * r, 128 + Math.sin(a) * r);
    }
    g.closePath();
    g.fillStyle = fill;
    g.fill();
    g.lineWidth = 9;
    g.strokeStyle = ink;
    g.lineJoin = 'round';
    g.stroke();
    let size = word.length > 4 ? 46 : 56;
    g.font = `${size}px ${FONT}`;
    const w = g.measureText(word).width;
    if (w > 190) g.font = `${Math.floor((size * 190) / w)}px ${FONT}`; // keep it inside the star
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.lineWidth = 10;
    g.strokeStyle = '#14121f';
    g.strokeText(word, 128, 134);
    g.fillStyle = '#ffffff';
    g.fillText(word, 128, 134);
    return (burstCache[key] = toTexture(c));
  }

  function bursts(scene, max = 6) {
    const pool = [];
    for (let i = 0; i < max; i++) {
      const s = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, depthTest: false, transparent: true }));
      s.visible = false;
      s.renderOrder = 21;
      scene.add(s);
      pool.push({ s, age: 0, size: 1, life: 0.6 });
    }
    let next = 0;
    return {
      add(word, x, y, z, size = 1.6, fill, ink) {
        const b = pool[next];
        next = (next + 1) % max;
        b.s.material.map = burstTexture(word, fill, ink);
        b.s.material.needsUpdate = true;
        b.s.material.rotation = rand(-0.3, 0.3);
        b.s.position.set(x, y, z);
        b.s.visible = true;
        Object.assign(b, { age: 0, size, life: 0.62 });
      },
      update(dt) {
        for (const b of pool) {
          if (!b.s.visible) continue;
          b.age += dt;
          const u = b.age / b.life;
          if (u >= 1) {
            b.s.visible = false;
            continue;
          }
          const pop = u < 0.2 ? (u / 0.2) * 1.25 : 1.25 - Math.min(0.25, (u - 0.2) * 1.2);
          b.s.scale.setScalar(b.size * pop);
          b.s.position.y += dt * 0.6;
          b.s.material.opacity = u > 0.65 ? 1 - (u - 0.65) / 0.35 : 1;
        }
      },
      clear() {
        for (const b of pool) b.s.visible = false;
      },
    };
  }

  // ---------------------------------------------------------------- 2D overlay: confetti and emoji in screen pixels

  const overlay = (function () {
    let cv = null, g = null, dpr = 1;
    const parts = [];
    const COLORS = ['#ffd400', '#ff3d7f', '#18d4ff', '#3fe0b0', '#ff8a1f', '#a77bff'];
    function init(canvas) {
      cv = canvas;
      g = cv.getContext('2d');
      resize();
    }
    function resize() {
      if (!cv) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(innerWidth * dpr));
      cv.height = Math.max(1, Math.round(innerHeight * dpr));
    }
    // a burst of confetti (and optionally emoji) at screen point (x, y)
    function burst(x, y, n = 24, emojis = null, power = 1) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(180, 520) * power;
        const emo = emojis && Math.random() < 0.4 ? pick(emojis) : null;
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 260 * power, life: rand(0.9, 1.5), age: 0,
          rot: rand(0, 6), vr: rand(-10, 10), w: rand(8, 15), h: rand(5, 9), color: pick(COLORS), emo, size: rand(26, 40),
        });
      }
      while (parts.length > 400) parts.shift();
    }
    // confetti raining down from the top edge
    function rain(n = 80) {
      for (let i = 0; i < n; i++) {
        parts.push({
          x: rand(0, innerWidth), y: rand(-200, -10), vx: rand(-60, 60), vy: rand(80, 260), life: rand(2, 3.2), age: 0,
          rot: rand(0, 6), vr: rand(-8, 8), w: rand(8, 15), h: rand(5, 9), color: pick(COLORS), emo: null, size: 0,
        });
      }
    }
    function update(dt) {
      if (!g) return;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += dt;
        if (p.age >= p.life) {
          parts.splice(i, 1);
          continue;
        }
        p.vy += 700 * dt;
        p.vx *= 1 - 1.6 * dt;
        p.vy *= 1 - 0.9 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        const u = p.age / p.life;
        g.globalAlpha = u > 0.75 ? 1 - (u - 0.75) / 0.25 : 1;
        g.save();
        g.translate(p.x, p.y);
        g.rotate(p.rot);
        if (p.emo) {
          g.font = `${p.size}px ${Kit.gfx.EMOJI_FONT}`;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(p.emo, 0, 0);
        } else {
          g.fillStyle = p.color;
          g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1);
        }
        g.restore();
      }
      g.globalAlpha = 1;
    }
    const clear = () => { parts.length = 0; };
    return { init, resize, burst, rain, update, clear, get count() { return parts.length; } };
  })();

  TR.fx = { flyers, bursts, burstTexture, overlay };
})();

</script>
<script>
/* TT Treasure Runner: the renderer, the sunny sky and hills behind the level, and the fixed arcade camera.
   The level itself (bricks, ladders, gold, robots) is js/world.js.
     fit(box, margins)   aim the camera so a world box { x0, x1, y0, y1 } fills the screen minus margins (in pixels)
     toScreen(v)         a world point in screen pixels
     shake(secs)         the camera shakes for a moment */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const { makeCanvas, toTexture, std, rand } = Kit.gfx;

  let renderer = null, W = 1, H = 1, sunLight = null;
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(18, 1, 0.5, 900); // a long lens: the grid stays square, the blocks still look 3D
  const camBase = new T.Vector3();
  const fx = { shake: 0 };
  const SKY = '#9fdcff';
  const ELEV = 0.13; // the camera looks down a little, so you see the tops of the bricks

  function init(canvas) {
    renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    buildSky();
    resize();
  }

  function resize() {
    W = Math.max(1, innerWidth || 1);
    H = Math.max(1, innerHeight || 1);
    if (renderer) renderer.setSize(W, H, false);
    cam.aspect = W / H;
    cam.updateProjectionMatrix();
  }

  // ---------------------------------------------------------------- the sky, clouds and hills

  function skyTexture() {
    const [c, g] = makeCanvas(4, 256);
    const grd = g.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, '#5fc4ff');
    grd.addColorStop(0.6, '#a8e2ff');
    grd.addColorStop(1, '#fff3c9');
    g.fillStyle = grd;
    g.fillRect(0, 0, 4, 256);
    return toTexture(c);
  }

  const cloudMat = std('#ffffff', { roughness: 1 });
  function cloud(x, y, z, s) {
    const g = new T.Group();
    for (let i = 0; i < 5; i++) {
      const m = new T.Mesh(new T.SphereGeometry(1, 16, 12), cloudMat);
      m.position.set((i - 2) * 1.1 * s, Math.sin(i * 1.7) * 0.3 * s, 0);
      m.scale.set(1.2 * s, (0.8 + (i % 2) * 0.3) * s, 0.6 * s);
      g.add(m);
    }
    g.position.set(x, y, z);
    scene.add(g);
    return g;
  }

  const clouds = [];
  function buildSky() {
    scene.background = new T.Color(SKY);
    const sky = new T.Mesh(new T.PlaneGeometry(600, 260), new T.MeshBasicMaterial({ map: skyTexture(), depthWrite: false, fog: false }));
    sky.position.set(0, 40, -160);
    scene.add(sky);
    scene.fog = new T.Fog(SKY, 120, 260);
    scene.add(new T.HemisphereLight('#ffffff', '#7fae6a', 0.7));
    const sun = new T.DirectionalLight('#fff4dc', 0.75);
    sun.position.set(-8, 14, 22);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    const sc = sun.shadow.camera;
    sc.left = -16; sc.right = 16; sc.top = 14; sc.bottom = -14; sc.near = 1; sc.far = 60;
    sun.shadow.bias = -0.001;
    scene.add(sun);
    scene.add(sun.target);
    sunLight = sun;
    // rolling green hills and a sandy beach far behind the level
    const hillMats = ['#7fd36b', '#5fbf5a', '#9be27a'].map((c) => std(c, { roughness: 1 }));
    for (let i = 0; i < 9; i++) {
      const h = new T.Mesh(new T.SphereGeometry(1, 24, 16), hillMats[i % 3]);
      const r = rand(14, 26);
      h.scale.set(r * 1.4, r * 0.55, r * 0.6);
      h.position.set(-70 + i * 18 + rand(-4, 4), -6 - r * 0.15, -60 - (i % 2) * 14);
      scene.add(h);
    }
    for (const [x, y, z, s] of [[-30, 22, -70, 2.6], [8, 27, -90, 3.2], [36, 20, -75, 2.4], [-55, 30, -110, 3.4], [62, 30, -110, 3]]) clouds.push(cloud(x, y, z, s));
    // a little sun
    const disc = new T.Mesh(new T.CircleGeometry(7, 32), new T.MeshBasicMaterial({ color: '#fff6a8', fog: false }));
    disc.position.set(48, 46, -150);
    scene.add(disc);
  }

  // ---------------------------------------------------------------- camera

  // Aim the camera (looking a little down) so the world box fills the screen minus margins { l, r, t, b } in pixels.
  // It fits the box in the middle of the picture, then slides the picture (the view offset) over the free part of the screen.
  const tmp = new T.Vector3();
  function fit(box, m) {
    cam.clearViewOffset();
    const dir = new T.Vector3(0, Math.sin(ELEV), Math.cos(ELEV));
    const center = new T.Vector3((box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2, 0);
    const pts = [];
    for (const x of [box.x0, box.x1]) for (const y of [box.y0, box.y1]) for (const z of [-0.5, 0.6]) pts.push(new T.Vector3(x, y, z));
    const fw = Math.max(0.1, (W - m.l - m.r) / W), fh = Math.max(0.1, (H - m.t - m.b) / H);
    const place = (d) => {
      cam.position.copy(center).addScaledVector(dir, d);
      cam.lookAt(center);
      cam.updateMatrixWorld(true);
    };
    const fits = () => {
      for (const p of pts) {
        tmp.copy(p).project(cam);
        if (Math.abs(tmp.x) > fw || Math.abs(tmp.y) > fh) return false;
      }
      return true;
    };
    let lo = 2, hi = 600;
    for (let i = 0; i < 36; i++) {
      const mid = (lo + hi) / 2;
      place(mid);
      if (fits()) hi = mid;
      else lo = mid;
    }
    place(hi);
    // the haze starts behind the level however far back the camera had to go (a tall phone puts it far away)
    scene.fog.near = hi + 60;
    scene.fog.far = hi + 220;
    const bx = (m.l + W - m.r) / 2, by = (m.t + H - m.b) / 2;
    cam.setViewOffset(W, H, W / 2 - bx, H / 2 - by, W, H);
    cam.updateMatrixWorld(true);
    camBase.copy(cam.position);
  }

  function toScreen(v, out = { x: 0, y: 0 }) {
    tmp.copy(v).project(cam);
    out.x = ((tmp.x + 1) / 2) * W;
    out.y = ((1 - tmp.y) / 2) * H;
    return out;
  }

  function shake(secs = 0.3) {
    fx.shake = Math.max(fx.shake, secs);
  }

  let t = 0;
  function update(dt) {
    t += dt;
    clouds.forEach((c, i) => (c.position.x += dt * (0.6 + i * 0.15) * (i % 2 ? 1 : -1) * 0.5));
    if (fx.shake > 0) {
      fx.shake -= dt;
      const a = Math.max(0, fx.shake) * 0.25;
      cam.position.set(camBase.x + rand(-a, a), camBase.y + rand(-a, a), camBase.z);
      cam.updateMatrixWorld(true);
    } else if (!cam.position.equals(camBase) && camBase.lengthSq()) {
      cam.position.copy(camBase);
      cam.updateMatrixWorld(true);
    }
  }

  function render() {
    if (renderer) renderer.render(scene, cam);
  }

  TR.stage = { // (a plain object literal: Object.assign would copy the getters' values once)
    init, resize, render, update, fit, toScreen, shake, scene, cam,
    get W() { return W; },
    get H() { return H; },
    get renderer() { return renderer; },
    get sun() { return sunLight; },
  };
})();

</script>
<script>
/* TT Treasure Runner: a level in 3D. Chunky toy bricks with studs (you can dig them), blue steel blocks with rivets (you
   can't), yellow ladders, cyan monkey bars, stacks of gold coins, the rainbow exit ladder (it grows up out of the floor when
   the gold's all in) and the googly-eyed robot vacuums. Everything is drawn from the rules' state each frame.
     TR.makeWorld(spec)          → world { group, update(s, dt), dispose(), at(x, y), box }
     world.at(x, y)              the bottom middle of cell (x, y) in world units (one cell = 1)
   Robots: every robot gets a vacuum (robotMesh) the world moves; stuck in a hole its eyes spin, trapped it sneezes and
   floats away under a balloon. */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const { makeCanvas, toTexture, std, emojiTexture, rand, roundRect } = Kit.gfx;
  const { BRICK, STONE, LADDER, BAR, EXIT } = TR;

  // ---------------------------------------------------------------- textures (painted once)

  let tex = null;
  function textures() {
    if (tex) return tex;
    tex = {};
    {
      // toy bricks: warm orange-red with two rows of little bricks and a soft bevel
      const [c, g] = makeCanvas(128, 128);
      g.fillStyle = '#f2643a';
      g.fillRect(0, 0, 128, 128);
      g.fillStyle = '#ff8a5c';
      for (const [x, y, w] of [[4, 4, 56], [68, 4, 56], [-28, 68, 56], [36, 68, 56], [100, 68, 56]]) {
        roundRect(g, x, y, w, 56, 9);
        g.fill();
      }
      g.fillStyle = 'rgba(255,255,255,0.28)';
      for (const [x, y, w] of [[8, 8, 48], [72, 8, 48], [40, 72, 48]]) g.fillRect(x, y, w, 7);
      g.strokeStyle = 'rgba(120,30,10,0.45)';
      g.lineWidth = 5;
      g.strokeRect(2.5, 2.5, 123, 123);
      tex.brick = toTexture(c);
    }
    {
      // steel blocks: blue-grey with a frame and four rivets ("can't dig this one")
      const [c, g] = makeCanvas(128, 128);
      g.fillStyle = '#7f93b8';
      g.fillRect(0, 0, 128, 128);
      g.fillStyle = '#93a8cf';
      roundRect(g, 12, 12, 104, 104, 10);
      g.fill();
      g.strokeStyle = '#56688f';
      g.lineWidth = 6;
      g.strokeRect(3, 3, 122, 122);
      for (const [x, y] of [[22, 22], [106, 22], [22, 106], [106, 106]]) {
        g.fillStyle = '#56688f';
        g.beginPath();
        g.arc(x, y, 8, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#d7e2f7';
        g.beginPath();
        g.arc(x - 2, y - 2, 3.5, 0, Math.PI * 2);
        g.fill();
      }
      g.strokeStyle = 'rgba(255,255,255,0.35)';
      g.lineWidth = 6;
      g.beginPath();
      g.moveTo(34, 94);
      g.lineTo(94, 34);
      g.stroke();
      tex.stone = toTexture(c);
    }
    {
      // the wall behind the level: soft cream tiles
      const [c, g] = makeCanvas(128, 128);
      g.fillStyle = '#fff1d2';
      g.fillRect(0, 0, 128, 128);
      g.strokeStyle = 'rgba(214,170,110,0.35)';
      g.lineWidth = 4;
      g.strokeRect(2, 2, 124, 124);
      g.fillStyle = 'rgba(255,214,120,0.35)';
      g.beginPath();
      g.arc(64, 64, 10, 0, Math.PI * 2);
      g.fill();
      tex.wall = toTexture(c, true);
    }
    return tex;
  }

  // shared geometry and materials
  let kit = null;
  function parts() {
    if (kit) return kit;
    const t = textures();
    kit = {
      brickGeo: new T.BoxGeometry(0.98, 0.98, 1),
      studGeo: new T.CylinderGeometry(0.15, 0.15, 0.1, 14),
      brickMat: std('#ffffff', { map: t.brick, roughness: 0.55 }),
      studMat: std('#ff7a4c', { roughness: 0.45 }),
      stoneMat: std('#ffffff', { map: t.stone, roughness: 0.35, metalness: 0.25 }),
      railMat: std('#ffcf1f', { roughness: 0.5 }),
      rungMat: std('#ffb000', { roughness: 0.5 }),
      barMat: std('#28c8f0', { roughness: 0.3, metalness: 0.2 }),
      capMat: std('#1a8fd0', { roughness: 0.4 }),
      coinMat: std('#ffcf2e', { roughness: 0.3, metalness: 0.12, emissive: '#c07a00', emissiveIntensity: 0.38 }),
      coinEdge: std('#f0a800', { roughness: 0.35, metalness: 0.1, emissive: '#8a5200', emissiveIntensity: 0.3 }),
      ghostMat: new T.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.32, depthWrite: false }),
      frameMat: std('#b5763c', { roughness: 0.8 }),
      rainbow: ['#ff5a4e', '#ff9a3c', '#ffd400', '#3fd17a', '#28b8f0', '#a77bff'].map((c) => std(c, { roughness: 0.45, emissive: c, emissiveIntensity: 0.2 })),
    };
    return kit;
  }

  // a stack of three gold coins (and a sparkle)
  function coinStack(k) {
    const g = new T.Group();
    for (let i = 0; i < 3; i++) {
      const coin = new T.Mesh(new T.CylinderGeometry(0.25, 0.25, 0.08, 20), [k.coinEdge, k.coinMat, k.coinMat]);
      coin.position.set((i - 1) * 0.05, 0.05 + i * 0.085, (i % 2) * 0.03);
      coin.castShadow = true;
      g.add(coin);
    }
    const big = new T.Mesh(new T.CylinderGeometry(0.27, 0.27, 0.07, 22), [k.coinEdge, k.coinMat, k.coinMat]);
    big.rotation.x = Math.PI / 2;
    big.position.set(0, 0.5, 0.05);
    big.castShadow = true;
    g.add(big);
    g.userData.big = big;
    return g;
  }

  function ladderCell(k, rungMats) {
    const g = new T.Group();
    for (const sx of [-0.32, 0.32]) {
      const rail = new T.Mesh(new T.BoxGeometry(0.08, 1, 0.08), k.railMat);
      rail.position.set(sx, 0.5, -0.3);
      g.add(rail);
    }
    for (let i = 0; i < 3; i++) {
      const rung = new T.Mesh(new T.CylinderGeometry(0.035, 0.035, 0.64, 8), rungMats ? rungMats[i % rungMats.length] : k.rungMat);
      rung.rotation.z = Math.PI / 2;
      rung.position.set(0, 0.18 + i * 0.33, -0.3);
      g.add(rung);
    }
    return g;
  }

  function barCell(k, left, right) {
    const g = new T.Group();
    const bar = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 1, 10), k.barMat);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, 0.88, 0);
    bar.castShadow = true;
    g.add(bar);
    for (const [on, sx] of [[left, -0.5], [right, 0.5]]) {
      if (!on) continue;
      const cap = new T.Mesh(new T.SphereGeometry(0.09, 12, 8), k.capMat);
      cap.position.set(sx, 0.88, 0);
      g.add(cap);
    }
    return g;
  }

  // ---------------------------------------------------------------- a robot vacuum

  const ROBOT_COLORS = ['#ff6fae', '#2fd0c0', '#a77bff', '#ff9a3c', '#5fa8ff', '#9be15d'];
  function robotMesh(i, k) {
    const root = new T.Group();
    const body = new T.Group();
    root.add(body);
    const col = ROBOT_COLORS[i % ROBOT_COLORS.length];
    const shell = new T.Mesh(new T.CylinderGeometry(0.36, 0.38, 0.22, 28), std(col, { roughness: 0.35 }));
    shell.position.y = 0.15;
    shell.castShadow = true;
    body.add(shell);
    const bumper = new T.Mesh(new T.CylinderGeometry(0.395, 0.395, 0.08, 28), std('#3a3550', { roughness: 0.6 }));
    bumper.position.y = 0.08;
    body.add(bumper);
    const top = new T.Mesh(new T.CylinderGeometry(0.24, 0.24, 0.03, 24), std(Kit.gfx.shade(col, 0.35), { roughness: 0.3 }));
    top.position.y = 0.27;
    body.add(top);
    const btn = new T.Mesh(new T.SphereGeometry(0.06, 12, 8), std('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.3 }));
    btn.position.set(0, 0.29, -0.08);
    body.add(btn);
    // antenna with a bobble
    const ant = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 0.22, 6), std('#3a3550'));
    ant.position.set(0.12, 0.38, -0.05);
    body.add(ant);
    const bob = new T.Mesh(new T.SphereGeometry(0.045, 10, 8), std('#ffd400', { emissive: '#ffd400', emissiveIntensity: 0.4 }));
    bob.position.set(0.12, 0.5, -0.05);
    body.add(bob);
    // googly eyes on the front, looking at you
    const eyes = [];
    for (const sx of [-0.13, 0.13]) {
      const white = new T.Mesh(new T.SphereGeometry(0.12, 18, 12), std('#ffffff', { roughness: 0.2 }));
      white.position.set(sx, 0.33, 0.2);
      body.add(white);
      const pupil = new T.Mesh(new T.SphereGeometry(0.06, 12, 10), std('#14121f', { roughness: 0.2 }));
      pupil.position.set(sx, 0.33, 0.31);
      body.add(pupil);
      eyes.push({ pupil, x: sx, ox: 0, oy: 0, vx: 0, vy: 0 });
    }
    // a little spinning side brush
    const brush = new T.Group();
    for (let a = 0; a < 3; a++) {
      const bristle = new T.Mesh(new T.BoxGeometry(0.2, 0.012, 0.03), std('#ffffff'));
      bristle.position.x = 0.1;
      const arm = new T.Group();
      arm.rotation.y = (a / 3) * Math.PI * 2;
      arm.add(bristle);
      brush.add(arm);
    }
    brush.position.set(0.26, 0.03, 0.22);
    body.add(brush);
    // the hook it hangs from a bar by, and the gold it carries
    const hook = new T.Group();
    const stick = new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 0.5, 6), std('#3a3550'));
    stick.position.y = 0.55;
    hook.add(stick);
    const curl = new T.Mesh(new T.TorusGeometry(0.07, 0.02, 6, 12, Math.PI * 1.3), std('#3a3550'));
    curl.position.set(0.05, 0.82, 0);
    hook.add(curl);
    hook.visible = false;
    body.add(hook);
    const loot = coinStack(k);
    loot.scale.setScalar(0.7);
    loot.position.set(-0.12, 0.28, -0.05);
    loot.visible = false;
    body.add(loot);
    // a balloon (floating away) and dizzy stars (stuck)
    const balloon = new T.Sprite(new T.SpriteMaterial({ map: emojiTexture('🎈'), depthWrite: false, transparent: true }));
    balloon.scale.setScalar(0.7);
    balloon.position.y = 1.05;
    balloon.visible = false;
    root.add(balloon);
    const dizzy = new T.Sprite(new T.SpriteMaterial({ map: emojiTexture('💫'), depthWrite: false, transparent: true }));
    dizzy.scale.setScalar(0.45);
    dizzy.position.y = 0.75;
    dizzy.visible = false;
    root.add(dizzy);
    return { root, body, eyes, brush, hook, loot, balloon, dizzy, bob, t: rand(0, 6), lastX: 0, lastY: 0, outT: 0, wasOut: false, spin: 0 };
  }

  // ---------------------------------------------------------------- the level

  function makeWorld(spec) {
    const k = parts();
    const t = textures();
    const { W, H, tiles } = spec;
    const group = new T.Group();
    const X = (x) => x - (W - 1) / 2;
    const Y = (y) => H - 1 - y; // the bottom of row y
    const at = (x, y, out = new T.Vector3()) => out.set(X(x), Y(y), 0);

    // the wall behind and a wooden frame round the sides and the bottom
    const wt = t.wall.clone();
    wt.needsUpdate = true;
    wt.repeat.set(W / 2, H / 2);
    const wall = new T.Mesh(new T.PlaneGeometry(W, H), std('#ffffff', { map: wt, roughness: 1 }));
    wall.position.set(0, H / 2, -0.55);
    wall.receiveShadow = true;
    group.add(wall);
    const F = 0.34;
    for (const [w, h, x, y] of [[F, H + F, -W / 2 - F / 2, (H - F) / 2], [F, H + F, W / 2 + F / 2, (H - F) / 2], [W + 2 * F, F, 0, -F / 2]]) {
      const m = new T.Mesh(new T.BoxGeometry(w, h, 1.2), k.frameMat);
      m.position.set(x, y, -0.05);
      m.receiveShadow = true;
      group.add(m);
    }
    // the meadow the frame stands in
    const grass = new T.Mesh(new T.PlaneGeometry(600, 240), std('#86d96f', { roughness: 1 }));
    grass.rotation.x = -Math.PI / 2;
    grass.position.set(0, -0.34, -60);
    group.add(grass);

    // bricks and studs (instanced: one draw each), steel blocks
    const bricks = [], stones = [];
    for (let c = 0; c < spec.n; c++) {
      if (tiles[c] === BRICK) bricks.push(c);
      else if (tiles[c] === STONE) stones.push(c);
    }
    const brickIx = new Int32Array(spec.n).fill(-1);
    const brickMesh = new T.InstancedMesh(k.brickGeo, k.brickMat, Math.max(1, bricks.length));
    const studMesh = new T.InstancedMesh(k.studGeo, k.studMat, Math.max(1, bricks.length * 2));
    const stoneMesh = new T.InstancedMesh(k.brickGeo, k.stoneMat, Math.max(1, stones.length));
    for (const m of [brickMesh, studMesh, stoneMesh]) {
      m.castShadow = true;
      m.receiveShadow = true;
      m.count = 0;
      group.add(m);
    }
    const mtx = new T.Matrix4(), q = new T.Quaternion(), sc = new T.Vector3(), pos = new T.Vector3();
    const exposed = (c) => c < W || (tiles[c - W] !== BRICK && tiles[c - W] !== STONE);
    function placeBrick(i, c, s = 1, wob = 0) {
      const x = c % W, y = (c / W) | 0;
      pos.set(X(x) + wob, Y(y) + 0.5 - (1 - s) * 0.45, 0);
      sc.set(s, s, s);
      mtx.compose(pos, q, sc);
      brickMesh.setMatrixAt(i, mtx);
      const on = exposed(c) ? s : 0;
      for (const [j, dx] of [[0, -0.24], [1, 0.24]]) {
        pos.set(X(x) + dx * s + wob, Y(y) + 0.5 - (1 - s) * 0.45 + 0.5 * s + 0.04, 0.22 * s);
        sc.set(on, on, on);
        mtx.compose(pos, q, sc);
        studMesh.setMatrixAt(i * 2 + j, mtx);
      }
    }
    bricks.forEach((c, i) => {
      brickIx[c] = i;
      placeBrick(i, c);
    });
    stones.forEach((c, i) => {
      pos.set(X(c % W), Y((c / W) | 0) + 0.5, 0);
      sc.set(1, 1, 1);
      mtx.compose(pos, q, sc);
      stoneMesh.setMatrixAt(i, mtx);
    });
    brickMesh.count = bricks.length;
    studMesh.count = bricks.length * 2;
    stoneMesh.count = stones.length;
    brickMesh.instanceMatrix.needsUpdate = studMesh.instanceMatrix.needsUpdate = stoneMesh.instanceMatrix.needsUpdate = true;

    // ladders, bars, the exit ladder
    const exitParts = [];
    for (let c = 0; c < spec.n; c++) {
      const x = c % W, y = (c / W) | 0, tl = tiles[c];
      if (tl === LADDER || tl === EXIT) {
        const l = ladderCell(k, tl === EXIT ? k.rainbow.slice((y * 2) % 6).concat(k.rainbow) : null);
        l.position.copy(at(x, y));
        group.add(l);
        if (tl === EXIT) {
          l.visible = false;
          // a see-through ghost of it shows where it will grow
          const ghost = ladderCell(k, [k.ghostMat]);
          ghost.traverse((o) => { if (o.isMesh) { o.material = k.ghostMat; o.castShadow = false; } });
          ghost.position.copy(l.position);
          group.add(ghost);
          exitParts.push({ g: l, y, ghost });
        }
      } else if (tl === BAR) {
        const b = barCell(k, x === 0 || tiles[c - 1] !== BAR, x === W - 1 || tiles[c + 1] !== BAR);
        b.position.copy(at(x, y));
        group.add(b);
      }
    }
    // a flag on top of the exit, shown when it opens
    const flag = new T.Sprite(new T.SpriteMaterial({ map: emojiTexture('🏁'), depthWrite: false, transparent: true }));
    flag.scale.setScalar(0.9);
    flag.visible = false;
    const topExit = spec.exits.filter((c) => c < W).map((c) => c % W)[0];
    if (topExit != null) flag.position.copy(at(topExit, 0)).add(new T.Vector3(0.55, 0.75, 0.3));
    group.add(flag);

    // gold: a pool of coin stacks put where the gold is each frame
    const coins = [];
    for (let i = 0; i < spec.total; i++) {
      const g = coinStack(k);
      g.visible = false;
      group.add(g);
      coins.push(g);
    }

    // robots
    const robots = spec.robots.map((c, i) => {
      const r = robotMesh(i, k);
      r.root.scale.setScalar(1.25);
      r.root.position.copy(at(c % W, (c / W) | 0));
      group.add(r.root);
      return r;
    });

    // ---------------------------------------------------------------- each frame

    let clock = 0, exitT = -1;
    const dirty = new Set();
    function update(s, dt) {
      clock += dt;
      // holes: a brick being dug crumbles, an open hole is empty, a closing one grows back with a wobble
      for (let c = 0; c < spec.n; c++) if (s.hole[c]) dirty.add(c);
      for (const c of dirty) {
        const i = brickIx[c];
        if (i < 0) { dirty.delete(c); continue; }
        let sc1 = 1, wob = 0;
        if (s.hole[c] === 1) {
          const u = 1 - Math.max(0, s.holeT[c]) / s.cfg.dig;
          sc1 = 1 - u * 0.75;
          wob = Math.sin(clock * 60) * 0.04;
        } else if (s.hole[c] === 2) {
          const left = s.holeT[c];
          sc1 = left < 0.7 ? Math.max(0.01, (0.7 - left) / 0.7) : 0.0001;
          if (left < 0.7) wob = Math.sin(clock * 40) * 0.03 * (left / 0.7);
        } else dirty.delete(c);
        placeBrick(i, c, sc1, wob);
      }
      brickMesh.instanceMatrix.needsUpdate = studMesh.instanceMatrix.needsUpdate = true;
      // gold
      let gi = 0;
      for (let c = 0; c < spec.n && gi < coins.length; c++) {
        if (!s.gold[c]) continue;
        const g = coins[gi++];
        g.visible = true;
        at(c % W, (c / W) | 0, g.position);
        g.position.y += 0.06 + Math.sin(clock * 3 + c) * 0.04;
        g.userData.big.rotation.z = 0;
        g.userData.big.rotation.y = clock * 2 + c;
      }
      for (; gi < coins.length; gi++) coins[gi].visible = false;
      // the exit ladder grows up out of the ground, rung by rung
      if (s.exitOpen && exitT < 0) exitT = 0;
      if (!s.exitOpen) exitT = -1;
      if (exitT >= 0) exitT += dt;
      for (const e of exitParts) {
        const delay = (H - 1 - e.y) * 0.08;
        const u = exitT < 0 ? 0 : Math.min(1, Math.max(0, (exitT - delay) / 0.25));
        e.g.visible = u > 0;
        e.g.scale.set(1, Math.max(0.01, u), 1);
        e.ghost.visible = u < 1;
      }
      flag.visible = exitT > 0.3;
      if (flag.visible) flag.material.rotation = Math.sin(clock * 3) * 0.15;
      // robots
      s.robots.forEach((b, i) => robotUpdate(robots[i], b, s, dt));
    }

    function robotUpdate(r, b, s, dt) {
      r.t += dt;
      const fx = TR.px(b), fy = TR.py(b);
      const tgt = at(fx, fy, new T.Vector3());
      const out = b.how === 'out';
      if (out && !r.wasOut) r.outT = 0;
      r.wasOut = out;
      if (out) {
        // sneezed out of the hole: up and away under a balloon
        r.outT += dt;
        r.root.visible = r.outT < 1.6;
        r.balloon.visible = true;
        r.root.position.set(tgt.x + Math.sin(r.outT * 4) * 0.15, tgt.y + r.outT * r.outT * 3.5, 0.1);
        r.body.rotation.z = Math.sin(r.outT * 6) * 0.25;
        r.dizzy.visible = false;
        return;
      }
      r.root.visible = true;
      r.balloon.visible = false;
      const vx = (fx - r.lastX) / Math.max(dt, 1e-3), vy = (fy - r.lastY) / Math.max(dt, 1e-3);
      r.lastX = fx;
      r.lastY = fy;
      r.root.position.set(tgt.x, tgt.y, 0.1);
      const moving = b.moving;
      // a little hop as it rolls, a lean into the turn
      r.body.position.y = moving && b.how === 'walk' ? Math.abs(Math.sin(r.t * 18)) * 0.04 : 0;
      r.body.rotation.z += ((moving && b.how === 'walk' ? -b.face * 0.12 : 0) - r.body.rotation.z) * Math.min(1, dt * 10);
      r.brush.rotation.y += dt * (moving ? 22 : 6);
      r.bob.position.y = 0.5 + Math.sin(r.t * 7) * 0.02;
      // on a bar it hangs from its hook; on a ladder it climbs flat against it
      const onBar = b.how === 'bar';
      r.hook.visible = onBar;
      r.body.position.y += onBar ? 0.05 : 0;
      r.loot.visible = b.gold >= 0;
      const stuck = b.how === 'hole';
      r.dizzy.visible = stuck;
      if (stuck) r.dizzy.material.rotation = r.t * 4;
      // googly eyes: the pupils lag behind the motion on springs (and spin round when stuck)
      for (const e of r.eyes) {
        let tx = Math.max(-1, Math.min(1, -vx * 0.04)) * 0.05 + b.face * 0.02, ty = Math.max(-1, Math.min(1, -vy * 0.04)) * 0.05;
        if (stuck) {
          tx = Math.cos(r.t * 9 + e.x * 20) * 0.05;
          ty = Math.sin(r.t * 9 + e.x * 20) * 0.05;
        }
        e.vx += ((tx - e.ox) * 160 - e.vx * 9) * dt;
        e.vy += ((ty - e.oy) * 160 - e.vy * 9) * dt;
        e.ox += e.vx * dt;
        e.oy += e.vy * dt;
        e.pupil.position.set(e.x + e.ox, 0.33 + e.oy, 0.31);
      }
    }

    function dispose() {
      group.traverse((o) => {
        if (o.isMesh && o.geometry && o.geometry !== k.brickGeo && o.geometry !== k.studGeo) o.geometry.dispose();
      });
      if (group.parent) group.parent.remove(group);
    }

    // the level's box on screen: the frame, plus room beside it for your brother
    const box = { x0: -W / 2 - 1.6, x1: W / 2 + 1.6, y0: -0.4, y1: H + 0.2 };
    return { group, update, dispose, at, box, robots, W, H, spec };
  }

  TR.makeWorld = makeWorld;
  TR.coinStack = (k) => coinStack(k || parts());
})();

</script>
<script>
/* TT Treasure Runner: a runner (Teddy or Tommy) or the visiting brother, a Kit.people person in the level (from TT Box Push,
   by way of TT Slide Escape). The game sets where he is each frame and what he's doing (show()):
     run       side on, running (left or right)          climb   his back to you, hand over hand up a ladder
     hang      facing you, hanging from a bar             fall    arms up, legs kicking
     dig       side on, a toy spade swung at the brick    giggle  tickled by a robot: wobbling, hugging his tummy
     stand     facing you, breathing
   and reactions on top: react('signature' | 'hello' | 'goodbye' | 'cheer' | 'over'), act(pose, secs), hold(emoji).
   Signatures: Teddy's boxing (💥) and 🏀 jump shot, Tommy's Y with ✌️. */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const { rand, emojiTexture, radialTexture, std } = Kit.gfx;

  const DUR = { cheer: 0.7, signature: 1.8, hello: 1.8 };
  const SPEED = { idle: 2.2, jump: 3, boxing: 6, peace: 4.2, wave: 5, jumpshot: 3, run: 13, give: 6, fall: 8, climb: 9, hang: 7, dig: 9, giggle: 14, high5: 3, point: 3 };
  const STANDING = { peace: 1, wave: 1, idle: 1, give: 1, high5: 1, point: 1 };
  const OURS = { climb: 1, hang: 1, dig: 1, giggle: 1, high5: 1, point: 1 };
  const FACE = { right: -Math.PI / 2, left: Math.PI / 2, you: 0.000001 + Math.PI, away: 0 };

  let shadowTex = null;

  function makeActor() {
    const holder = new T.Group();
    const shadow = new T.Mesh(new T.PlaneGeometry(1.3, 0.8), new T.MeshBasicMaterial({ depthWrite: false, transparent: true }));
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.02;
    shadow.renderOrder = 1;
    const ball = new T.Sprite(new T.SpriteMaterial({ map: emojiTexture('🏀'), depthWrite: false, transparent: true }));
    ball.visible = false;
    ball.renderOrder = 19;
    const held = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, transparent: true }));
    held.visible = false;
    held.renderOrder = 18;
    // a little blue toy spade for digging
    const spade = new T.Group();
    const handle = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 0.5, 6), std('#ffcf1f'));
    handle.position.y = -0.25;
    spade.add(handle);
    const blade = new T.Mesh(new T.BoxGeometry(0.22, 0.26, 0.04), std('#2f8fff', { roughness: 0.4 }));
    blade.position.y = -0.58;
    spade.add(blade);
    spade.visible = false;
    let p = null, entry = null, flyers = null;
    const st = {
      mode: 'idle', pose: 'idle', t: 0, phase: 0, hopY: 0, hopV: 0, wob: 9, wobAmp: 0, sigIx: 0, beat: -1, loop: null,
      ballT: -1, scale: 1, since: 0, bursts: 0, heldT: 0, base: 'stand', moving: false, face: 'you', giggleT: 0,
    };
    const tmp = new T.Vector3(), tmp2 = new T.Vector3(), ballFrom = new T.Vector3(), ballTo = new T.Vector3();

    function attach(scene, fl) {
      flyers = fl;
      scene.add(holder);
      scene.add(ball);
      if (!shadowTex) shadowTex = radialTexture(128, [[0, 'rgba(20,30,10,0.45)'], [0.6, 'rgba(20,30,10,0.2)'], [1, 'rgba(20,30,10,0)']]);
      shadow.material.map = shadowTex;
      shadow.material.needsUpdate = true;
      if (!shadow.parent) holder.add(shadow);
    }

    function set(id, scale = 1) {
      entry = Kit.roster.get(id) || Kit.roster.list[0];
      if (p) {
        holder.remove(p.root);
        p.root.traverse((o) => {
          if (o.isMesh) o.geometry.dispose();
        });
      }
      p = Kit.people.build(entry.look);
      p.root.rotation.y = FACE.you;
      holder.add(p.root);
      p.armR.add(spade);
      spade.position.set(0, -0.75, -0.1);
      Object.assign(st, { sigIx: 0, mode: 'idle', pose: 'idle', loop: null, ballT: -1 });
      ball.visible = false;
      setScale(scale);
      Kit.people.pose(p, 0, 'idle', 1);
      return entry;
    }

    function setScale(s) {
      st.scale = s;
      holder.scale.setScalar(s);
    }

    function place(x, y, z) {
      holder.position.set(x, y, z);
    }

    // What he's doing in the game this frame: base pose (run, climb, hang, fall, dig, giggle, stand), moving, facing.
    function show(base, moving, face) {
      st.base = base;
      st.moving = moving;
      st.face = face;
    }

    function react(kind) {
      if (!p) return null;
      if (st.loop && kind !== 'hello' && kind !== 'idle') return st.pose;
      switch (kind) {
        case 'hop':
          if (st.hopY < 0.05) st.hopV = Math.max(st.hopV, 2.2);
          return st.pose;
        case 'cheer':
          if (st.mode === 'signature') return st.pose;
          return begin('cheer', 'jump', DUR.cheer, 3.4);
        case 'signature': {
          if (st.mode === 'signature' && st.t > 0.4) return st.pose;
          const sig = entry.signature || ['wave'];
          const pose = sig[st.sigIx++ % sig.length];
          return begin('signature', pose, DUR.signature, hopFor(pose));
        }
        case 'hello':
          st.loop = null;
          return begin('signature', Kit.roster.signature(entry, 'hello'), DUR.hello, 2.6);
        case 'goodbye': {
          const pose = Kit.roster.signature(entry, 'goodbye');
          return begin('signature', pose, DUR.signature, hopFor(pose));
        }
        case 'over': {
          const sig = entry.signature || ['wave'];
          const pose = Kit.roster.signature(entry, 'goodbye');
          st.sigIx = sig.indexOf(pose) + 1;
          st.loop = true;
          st.loopWait = 0.6;
          return begin('signature', pose, DUR.signature, hopFor(pose));
        }
        case 'idle':
          st.loop = null;
          st.mode = 'idle';
          st.pose = 'idle';
          return 'idle';
      }
      return null;
    }

    function act(pose, dur, hop = 0, force = false) {
      if (!p || (!force && st.mode === 'signature' && st.t > 0.2)) return st.pose;
      if (st.mode === 'act' && st.pose === pose) {
        st.t = Math.max(st.t, dur);
        return pose;
      }
      return begin('act', pose, dur, hop);
    }

    const hopFor = (pose) => (pose === 'jumpshot' ? 5.4 : pose === 'peace' ? 2.6 : 1.4);

    function begin(mode, pose, dur, hop) {
      Object.assign(st, { mode, pose, t: dur, phase: 0, beat: -1, since: 0, bursts: 0 });
      if (hop) st.hopV = hop;
      if (pose === 'jumpshot') st.ballT = 0;
      return pose;
    }

    function hold(emoji, secs = 6) {
      if (!p) return;
      held.material.map = emojiTexture(emoji);
      held.material.needsUpdate = true;
      p.armL.add(held);
      held.position.set(0, -0.86, -0.25);
      held.scale.setScalar(0.62);
      held.visible = true;
      st.heldT = secs;
    }
    function drop() {
      held.visible = false;
      st.heldT = 0;
    }

    function update(dt) {
      if (!p) return;
      st.t -= dt;
      if (st.mode !== 'idle' && st.t <= 0) {
        st.mode = 'idle';
        st.pose = 'idle';
      }
      if (st.loop && st.mode === 'idle') {
        st.loopWait -= dt;
        if (st.loopWait <= 0) {
          st.loopWait = 0.6;
          const sig = entry.signature || ['wave'];
          const pose = sig[st.sigIx++ % sig.length];
          begin('signature', pose, DUR.signature, hopFor(pose));
        }
      }
      // a reaction (signature, cheer, wave, point) shows over standing or running; climbing, hanging, falling, digging
      // and giggling are what the game says he's doing
      const busy = st.base === 'climb' || st.base === 'hang' || st.base === 'fall' || st.base === 'dig' || st.base === 'giggle';
      let pose;
      if (st.mode !== 'idle' && !busy) pose = st.pose;
      else if (st.base === 'run') pose = st.moving ? 'run' : 'idle';
      else if (st.base === 'stand') pose = 'idle';
      else pose = st.base;
      const climbing = pose === 'climb' || pose === 'hang';
      st.phase += dt * (SPEED[pose] || 2.2) * (climbing && !st.moving ? 0 : 1);
      // which way he faces: the way he runs, his back to you on a ladder, towards you hanging, celebrating and standing
      let face = FACE.you;
      if (pose === 'run' || pose === 'dig' || pose === 'fall') face = st.face === 'left' ? FACE.left : st.face === 'right' ? FACE.right : FACE.you;
      else if (pose === 'climb') face = FACE.away;
      if (pose === 'fall' && st.face !== 'left' && st.face !== 'right') face = FACE.you;
      let da = face - p.root.rotation.y;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      p.root.rotation.y += da * (1 - Math.exp(-14 * dt));
      const k = 1 - Math.exp(-16 * dt);
      const was = OURS[pose] ? { rx: p.armR.rotation.x, rz: p.armR.rotation.z, lx: p.armL.rotation.x, lz: p.armL.rotation.z, hx: p.head.rotation.x, llx: p.legL.rotation.x, lrx: p.legR.rotation.x } : null;
      Kit.people.pose(p, st.phase, OURS[pose] ? 'idle' : pose, k);
      let tilt = 0;
      if (OURS[pose]) tilt = ours(pose, k, was);
      p.head.rotation.z += (tilt - p.head.rotation.z) * k;
      if (STANDING[pose]) {
        p.legL.rotation.x *= 0.35;
        p.legR.rotation.x *= 0.35;
      }
      if (pose === 'idle') {
        const breathe = Math.sin(st.phase) * 0.03;
        p.armL.rotation.z = -0.08 - breathe;
        p.armR.rotation.z = 0.08 + breathe;
      }
      spade.visible = pose === 'dig';
      // hanging: he hangs below the bar (his hands at the top of the cell)
      const hangDrop = pose === 'hang' ? -0.12 : 0;
      st.hopV -= 14 * dt;
      st.hopY = Math.max(0, st.hopY + st.hopV * dt);
      if (st.hopY === 0 && st.hopV < 0) st.hopV = 0;
      p.root.position.y = st.hopY + hangDrop;
      shadow.visible = pose !== 'hang' && pose !== 'climb' && pose !== 'fall';
      shadow.material.opacity = 1 / (1 + st.hopY * 1.2);
      st.wob += dt;
      p.root.rotation.z = st.wobAmp * Math.sin(st.wob * 17) * Math.exp(-st.wob * 3.2) + (pose === 'giggle' ? Math.sin(st.phase * 1.3) * 0.18 : 0);
      st.since += dt;
      if (st.heldT > 0) {
        st.heldT -= dt;
        if (st.heldT <= 0) drop();
      }
      holder.updateMatrixWorld(true);
      if (!flyers) return;
      const s = st.scale;
      if (pose === 'boxing') {
        const beat = Math.floor((((st.phase / (Math.PI * 2)) % 1) + 1) % 1 * 4);
        if (beat !== st.beat) {
          st.beat = beat;
          if (beat === 0 || beat === 2) {
            TR.sfx.kit('punch');
            Kit.people.handWorld(p, beat === 0 ? -1 : 1, tmp);
            flyers.add('💥', tmp.x, tmp.y, tmp.z + 0.3 * s, rand(-0.4, 0.4), rand(0.4, 1), 0.6 * s, 0.45, 0, 0);
          }
        }
      }
      if (pose === 'peace' && st.bursts < 3 && st.since > 0.15 + st.bursts * 0.55) {
        st.bursts++;
        for (const side of [-1, 1]) {
          Kit.people.handWorld(p, side, tmp);
          flyers.add(Math.random() < 0.7 ? '✌️' : '⭐', tmp.x, tmp.y + 0.1, tmp.z + 0.3, side * rand(0.3, 0.9), rand(1.6, 2.6), rand(0.45, 0.6) * s, 1.1, rand(-1, 1), 0.15);
        }
      }
      if (pose === 'giggle') {
        st.giggleT -= dt;
        if (st.giggleT <= 0) {
          st.giggleT = 0.28;
          const hp = holder.position;
          flyers.add(Math.random() < 0.6 ? '😆' : Math.random() < 0.5 ? '✨' : '💖', hp.x + rand(-0.3, 0.3), hp.y + 1.9 * s, hp.z + 0.4, rand(-0.8, 0.8), rand(1, 2), rand(0.35, 0.5), 0.9, rand(-2, 2), 0.5);
        }
      }
      updateBall(dt);
    }

    // Our poses on top of the Kit's standing pose. Returns the head's sideways tilt.
    function ours(pose, k, was) {
      const KEY = { rx: [p.armR.rotation, 'x'], rz: [p.armR.rotation, 'z'], lx: [p.armL.rotation, 'x'], lz: [p.armL.rotation, 'z'], hx: [p.head.rotation, 'x'], llx: [p.legL.rotation, 'x'], lrx: [p.legR.rotation, 'x'] };
      const to = (key, v) => {
        const [o, prop] = KEY[key];
        o[prop] = was[key] + (v - was[key]) * k;
      };
      const s = Math.sin(st.phase);
      if (pose === 'climb') {
        // hand over hand, knees up and down
        to('rx', 2.65 + s * 0.45);
        to('lx', 2.65 - s * 0.45);
        to('rz', 0.15);
        to('lz', -0.15);
        to('llx', 0.55 + s * 0.45);
        to('lrx', 0.55 - s * 0.45);
        return 0;
      }
      if (pose === 'hang') {
        // both hands up on the bar, swapping as he goes; legs together, swinging a little
        to('rx', 3.0 + (st.moving ? s * 0.25 : 0));
        to('lx', 3.0 - (st.moving ? s * 0.25 : 0));
        to('rz', 0.22);
        to('lz', -0.22);
        to('llx', 0.12 + Math.sin(st.phase * 0.5) * 0.15);
        to('lrx', 0.12 + Math.sin(st.phase * 0.5) * 0.15);
        return 0;
      }
      if (pose === 'dig') {
        // the spade swings up and chops down at the brick by his feet
        const u = (Math.sin(st.phase) + 1) / 2;
        to('rx', 0.4 + u * 1.9);
        to('rz', 0.05);
        to('lx', 0.9);
        to('lz', -0.2);
        to('hx', 0.35);
        to('llx', 0.3);
        to('lrx', -0.2);
        return 0;
      }
      if (pose === 'giggle') {
        // hugging his tummy and wriggling
        to('rx', 0.9 + s * 0.15);
        to('lx', 0.9 - s * 0.15);
        to('rz', -0.55);
        to('lz', 0.55);
        to('hx', -0.2);
        to('llx', s * 0.3);
        to('lrx', -s * 0.3);
        return 0.25 * Math.sin(st.phase * 0.7);
      }
      if (pose === 'point') {
        to('rx', 1.55 + s * 0.06);
        to('rz', 0);
        return 0;
      }
      if (pose === 'high5') {
        to('rx', 2.6);
        to('lx', 2.6);
        to('rz', 0.12);
        to('lz', -0.12);
        return 0;
      }
      return 0;
    }

    function fwd(out, len) {
      const a = p.root.rotation.y;
      return out.set(-Math.sin(a) * len, 0, -Math.cos(a) * len);
    }

    function updateBall(dt) {
      if (st.ballT < 0) return;
      st.ballT += dt;
      const s = st.scale;
      ball.scale.setScalar(0.5 * s);
      if (st.ballT < 0.38) {
        Kit.people.handWorld(p, -1, tmp);
        Kit.people.handWorld(p, 1, tmp2);
        ballFrom.copy(tmp).add(tmp2).multiplyScalar(0.5);
        ballFrom.y += 0.2 * s;
        ball.position.copy(ballFrom);
        ball.visible = true;
        ballTo.copy(ballFrom);
        fwd(tmp, 1.6 * s);
        ballTo.x += tmp.x + 1.2 * s;
        ballTo.z += tmp.z;
        ballTo.y += 1.4 * s;
      } else {
        const u = Math.min(1, (st.ballT - 0.38) / 0.8);
        ball.position.lerpVectors(ballFrom, ballTo, u);
        ball.position.y += Math.sin(u * Math.PI) * 1.4 * s;
        ball.material.rotation -= 8 * dt;
        if (u >= 1) {
          ball.visible = false;
          st.ballT = -1;
          TR.sfx.kit('swish');
          for (let i = 0; i < 6; i++) flyers.add('⭐', ballTo.x, ballTo.y, ballTo.z, rand(-1.5, 1.5), rand(0.5, 2.5), 0.35 * s, 0.7, rand(-3, 3), 4);
        }
      }
    }

    return {
      attach, set, setScale, place, show, react, act, update, hold, drop,
      get entry() { return entry; },
      get person() { return p; },
      get mode() { return st.mode; },
      get pose() { return st.pose; },
      get base() { return st.base; },
      get root() { return holder; },
      get scale() { return st.scale; },
      get holding() { return st.heldT > 0; },
      set visible(v) {
        holder.visible = v;
        if (!v) {
          ball.visible = false;
          st.ballT = -1;
        }
      },
      get visible() { return holder.visible; },
    };
  }

  TR.makeActor = makeActor;
})();

</script>
<script>
/* TT Treasure Runner: your brother. In 1 player the other brother (Kit.roster.buddyFor: Teddy when Tommy plays, Tommy for
   Teddy) comes when called with T or his face button, any time and as often as you like. A visit:
     pop in beside the level (at his roster buddyScale, in a puff of stars) → hello with his signature move (Teddy's boxing
     or jump shot, Tommy's Y with ✌️) → toss you a treat (🍦 💧 🧃 🍪 🍉 🍌) → dig a row of holes in the floor in front of the
     nearest robot ("TOMMY SAYS: HOLES FOR THE ROBOT!"): little spades fly over and each brick crumbles → goodbye → pop out.
   Calling him again while he's there brings another treat and another row of holes.
   In 2 players both brothers are already playing, so T is a high five (TR.highFive): they jump and clap (💥 🙌). */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const { pick, emojiTexture, rand } = Kit.gfx;

  const V = { pop: 0.35, treatAt: 1.9, helpAt: 2.5, stay: 2.4 };
  const TREATS = [['🍦', 'ICE CREAM'], ['💧', 'WATER'], ['🧃', 'JUICE BOX'], ['🍪', 'COOKIE'], ['🍉', 'WATERMELON'], ['🍌', 'BANANA']];

  let api = null, entry = null, flyers = null;
  const actor = TR.makeActor();
  // phase: off | in | here | bye | out
  const b = { phase: 'off', t: 0, given: false, treatAt: V.treatAt, helped: false, doneAt: -1, calls: 0, treats: 0, holes: 0, lastTreat: null, lastPlan: null, popT: 0, side: 1 };
  const treat = { sprite: null, flyT: -1, emoji: '', from: new T.Vector3(), to: new T.Vector3() };
  const spades = []; // { sprite, from, to, t, cell }
  const tmp = new T.Vector3();

  function init(a) {
    api = a;
    flyers = a.flyers;
    treat.sprite = new T.Sprite(new T.SpriteMaterial({ depthWrite: false, depthTest: false, transparent: true }));
    treat.sprite.visible = false;
    treat.sprite.renderOrder = 22;
    TR.stage.scene.add(treat.sprite);
    actor.attach(TR.stage.scene, flyers);
    actor.visible = false;
  }

  function setFor(playerId) {
    const id = Kit.roster.buddyFor(playerId);
    if (entry && entry.id === id) return entry;
    dismiss();
    entry = Kit.roster.get(id);
    actor.set(id, 1);
    const tag = Kit.gfx.nameTag(entry.name, entry.tag || '#ffb02e');
    tag.position.y = 2.75;
    actor.person.root.add(tag);
    actor.visible = false;
    return entry;
  }

  const scaleNow = () => (entry.buddyScale || 0.8) * api.scale();

  // beside the level, on the grass, on the side nearer the robots
  function spot() {
    const w = api.world(), s = api.state();
    let side = b.side;
    if (s && s.robots.length && b.phase === 'off') {
      const plan = TR.buddyPlan(s);
      const rb = plan.robot >= 0 ? s.robots[plan.robot] : null;
      side = rb && rb.x < s.W / 2 ? -1 : 1;
    }
    return { x: side * (w.W / 2 + 1.0), y: -0.34, z: 0.5, side };
  }

  function call() {
    if (!entry) return 'none';
    b.calls++;
    if (b.phase === 'off' || b.phase === 'out') return summon();
    actor.react('hello');
    b.phase = 'here';
    b.t = Math.min(b.t, V.pop + 0.1);
    b.given = false;
    b.treatAt = b.t + 1.4;
    b.helped = false;
    b.doneAt = -1;
    api.toast(`${entry.name}'S HERE!`, 'buddy');
    TR.sfx.hello();
    return 'again';
  }

  function summon() {
    const sp = spot();
    b.side = sp.side;
    Object.assign(b, { phase: 'in', t: 0, given: false, treatAt: V.treatAt, helped: false, doneAt: -1, popT: 0 });
    actor.setScale(0.01);
    actor.place(sp.x, sp.y, sp.z);
    actor.show('stand', false, 'you');
    actor.visible = true;
    actor.react('idle');
    for (let i = 0; i < 14; i++) flyers.add(i % 3 ? '⭐' : '✨', sp.x, 0.6 + rand(0, 0.6), sp.z, rand(-2, 2), rand(1, 3), rand(0.22, 0.36), 0.8, rand(-4, 4), 3);
    api.toast(`${entry.name}'S HERE!`, 'buddy');
    TR.sfx.hello();
    return 'summoned';
  }

  function dismiss() {
    b.phase = 'off';
    actor.visible = false;
    treat.flyT = -1;
    if (treat.sprite) treat.sprite.visible = false;
    for (const sp of spades) TR.stage.scene.remove(sp.sprite);
    spades.length = 0;
  }

  // ---------------------------------------------------------------- the treat

  function giveTreat() {
    const [emoji, label] = pick(TREATS);
    treat.emoji = emoji;
    b.treats++;
    b.lastTreat = emoji;
    treat.sprite.material.map = emojiTexture(emoji);
    treat.sprite.material.needsUpdate = true;
    actor.root.updateMatrixWorld(true);
    Kit.people.handWorld(actor.person, 1, treat.from);
    treat.sprite.position.copy(treat.from);
    treat.sprite.scale.setScalar(0.6);
    treat.sprite.visible = true;
    treat.flyT = 0;
    api.toast(`${emoji} ${label} FROM ${entry.name}!`, 'treat');
    TR.sfx.kit('coin', 6);
  }

  function updateTreat(dt) {
    if (treat.flyT < 0) return;
    const player = api.player();
    treat.flyT += dt / 0.8;
    player.root.updateMatrixWorld(true);
    Kit.people.handWorld(player.person, -1, treat.to);
    const k = Math.min(1, treat.flyT);
    treat.sprite.position.lerpVectors(treat.from, treat.to, k);
    treat.sprite.position.y += Math.sin(k * Math.PI) * 2;
    treat.sprite.material.rotation = k * Math.PI * 2;
    if (k >= 1) {
      treat.flyT = -1;
      treat.sprite.visible = false;
      treat.sprite.material.rotation = 0;
      player.hold(treat.emoji, 6);
    }
  }

  // ---------------------------------------------------------------- the holes

  function digHoles() {
    const s = api.state();
    const plan = TR.buddyPlan(s);
    b.lastPlan = { robot: plan.robot, cells: plan.cells.slice() };
    if (plan.robot < 0) {
      api.toast(`${entry.name} SAYS: NO ROBOTS HERE! GO GET THE GOLD!`, 'save');
      actor.react('signature');
      return;
    }
    if (!plan.cells.length) {
      api.toast(`${entry.name} SAYS: NO BRICKS BY THE ROBOT! RUN!`, 'save');
      actor.react('signature');
      return;
    }
    api.toast(`${entry.name} SAYS: HOLES FOR THE ROBOT!`, 'save');
    actor.act('point', 1.6, 0, true);
    const w = api.world();
    actor.root.updateMatrixWorld(true);
    Kit.people.handWorld(actor.person, 1, tmp);
    plan.cells.forEach((c, i) => {
      const sp = new T.Sprite(new T.SpriteMaterial({ map: emojiTexture('⛏️'), depthWrite: false, depthTest: false, transparent: true }));
      sp.scale.setScalar(0.55);
      sp.renderOrder = 23;
      sp.visible = false;
      TR.stage.scene.add(sp);
      const to = w.at(c % s.W, ((c / s.W) | 0) - 1).add(new T.Vector3(0, 0.2, 0.5));
      spades.push({ sprite: sp, from: tmp.clone(), to, t: -i * 0.18, cell: c, n: i });
    });
  }

  function updateSpades(dt) {
    for (let i = spades.length - 1; i >= 0; i--) {
      const sp = spades[i];
      sp.t += dt;
      if (sp.t < 0) continue;
      const k = Math.min(1, sp.t / 0.45);
      sp.sprite.visible = true;
      sp.sprite.position.lerpVectors(sp.from, sp.to, k);
      sp.sprite.position.y += Math.sin(k * Math.PI) * 1.6;
      sp.sprite.material.rotation = -k * Math.PI * 3;
      if (k >= 1) {
        const s = api.state();
        if (s && TR.digAt(s, sp.cell)) b.holes++;
        TR.sfx.zap(sp.n);
        for (let n = 0; n < 6; n++) flyers.add(n % 2 ? '💨' : '✨', sp.to.x, sp.to.y - 0.3, sp.to.z, rand(-1.2, 1.2), rand(0.5, 2), 0.3, 0.6, rand(-3, 3), 3);
        TR.stage.scene.remove(sp.sprite);
        spades.splice(i, 1);
      }
    }
  }

  // ---------------------------------------------------------------- the visit

  function update(dt) {
    updateTreat(dt);
    updateSpades(dt);
    if (b.phase === 'off') return;
    b.t += dt;
    const full = scaleNow();
    if (b.phase === 'in' || b.phase === 'here' || b.phase === 'bye') {
      b.popT += dt;
      const u = Math.min(1, b.popT / V.pop);
      const spring = u < 1 ? 1 + Math.sin(u * Math.PI) * 0.25 : 1;
      actor.setScale(full * Math.max(0.01, u) * spring);
    }
    if (b.phase === 'in' && b.t >= V.pop) {
      b.phase = 'here';
      actor.react('hello');
    }
    if (b.phase === 'here') {
      if (!b.given && b.t > b.treatAt - 0.35) actor.act('give', 0.6, 0, true);
      if (!b.given && b.t > b.treatAt) {
        b.given = true;
        giveTreat();
      }
      if (b.given && !b.helped && b.t > Math.max(V.helpAt, b.treatAt + 0.6)) {
        b.helped = true;
        digHoles();
        b.doneAt = b.t;
      }
      if (b.doneAt >= 0 && b.t > b.doneAt + V.stay && !spades.length && treat.flyT < 0) {
        b.phase = 'bye';
        b.t = 0;
        actor.react('goodbye');
      }
    } else if (b.phase === 'bye') {
      if (b.t > 1.7) {
        b.phase = 'out';
        b.t = 0;
        TR.sfx.hello();
      }
    } else if (b.phase === 'out') {
      const u = Math.min(1, b.t / 0.25);
      actor.setScale(full * Math.max(0.01, 1 - u) * (1 + Math.sin(u * Math.PI) * 0.2));
      if (u >= 1) {
        const p = actor.root.position;
        for (let i = 0; i < 8; i++) flyers.add('✨', p.x, 0.6, p.z, rand(-1.5, 1.5), rand(1, 2.5), 0.25, 0.6, rand(-4, 4), 3);
        dismiss();
      }
    }
    actor.update(dt);
  }

  // ---------------------------------------------------------------- 2 players: the high five

  const hf = { on: false, t: 0, clapped: false, count: 0 };
  function highFive() {
    if (hf.on) return 'busy';
    Object.assign(hf, { on: true, t: 0, clapped: false });
    hf.count++;
    for (const a of api.players()) a.act('high5', 0.9, 2.6, true);
    return 'high5';
  }
  function updateHighFive(dt) {
    if (!hf.on) return;
    hf.t += dt;
    if (!hf.clapped && hf.t > 0.3) {
      hf.clapped = true;
      TR.sfx.clap();
      const ps = api.players().map((a) => a.root.position);
      const near = ps.length > 1 && ps[0].distanceTo(ps[1]) < 1.6;
      const at = near ? [ps[0].clone().add(ps[1]).multiplyScalar(0.5)] : ps;
      for (const p of at) {
        flyers.add('💥', p.x, p.y + 1.1, p.z + 0.4, 0, 0.5, 0.6, 0.5, 0, 0);
        for (let i = 0; i < 6; i++) flyers.add(i % 2 ? '🙌' : '⭐', p.x, p.y + 1.1, p.z + 0.4, rand(-2, 2), rand(1.2, 3), rand(0.28, 0.4), 1, rand(-3, 3), 4);
      }
      api.toast('HIGH FIVE! 🙌', 'buddy');
    }
    if (hf.t > 1.1) hf.on = false;
  }

  TR.buddy = {
    init, setFor, call, summon, dismiss, update, V,
    get entry() { return entry; },
    get actor() { return actor; },
    get on() { return b.phase !== 'off'; },
    get phase() { return b.phase; },
    info() {
      const r = actor.root.position;
      return {
        phase: b.phase, id: entry && entry.id, t: +b.t.toFixed(2), given: b.given, helped: b.helped, calls: b.calls, treats: b.treats, holes: b.holes,
        lastTreat: b.lastTreat, lastPlan: b.lastPlan, pose: actor.pose, x: +r.x.toFixed(2), scale: +actor.scale.toFixed(2), visible: actor.visible,
        flying: treat.flyT >= 0, spades: spades.length, highFives: hf.count, highFiving: hf.on,
      };
    },
  };
  TR.highFive = { start: highFive, update: updateHighFive, get on() { return hf.on; } };
})();

</script>
<script>
/* TT Treasure Runner: the level maker, for Teddy. A 20 x 12 grid: pick a tool (brick, steel, ladder, bar, gold, robot, the
   rainbow exit ladder, Teddy, Tommy, the sponge to rub things out) and tap or drag on the grid. Three slots (MY LEVEL 1, 2,
   3) save as you go. TRY IT checks the level (Teddy, some gold, the rainbow ladder up to the top row), asks the solver whether
   it can be cleared, then plays it. Your levels are in the level picker too. Keys: 1-9 and 0 pick a tool, the arrows move
   the pink box, Space puts the tool there, Enter tries it, Esc goes home. */
(function () {
  'use strict';
  const TR = window.TR;
  const W = 20, H = 12;
  const TOOLS = [
    ['#', '🧱', 'Brick: you can dig it'], ['@', '🔩', 'Steel: no digging'], ['H', '🪜', 'Ladder'], ['-', '➖', 'Bar'], ['$', '💰', 'Gold'],
    ['R', '🤖', 'Robot'], ['S', '🌈', 'Rainbow exit ladder'], ['1', 'teddy', 'Teddy'], ['2', 'tommy', 'Tommy'], ['.', '🧽', 'Rub out'],
  ];
  const BG = { '#': '#f2643a', '@': '#8fa3c8' };

  let api = null, ui = null, slot = 0, tool = '#', rows = null, cursor = { x: 1, y: 10 }, painting = false, open = false;

  function template() {
    const r = [];
    for (let y = 0; y < H; y++) {
      let line = '';
      for (let x = 0; x < W; x++) {
        let ch = '.';
        if (y === H - 1) ch = '@';
        else if (x === W - 2) ch = 'S';
        else if (y === H - 2 && x === 1) ch = '1';
        else if (y === H - 2 && x === 9) ch = '$';
        line += ch;
      }
      r.push(line);
    }
    return r;
  }

  function init(a) {
    api = a;
    ui = { tools: document.getElementById('edTools'), grid: document.getElementById('edGrid'), info: document.getElementById('edInfo'), slots: document.getElementById('edSlots') };
    const art = api.art();
    TOOLS.forEach(([ch, icon, label], i) => {
      const b = document.createElement('button');
      b.className = 'tool';
      b.dataset.t = ch;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.innerHTML = (art[icon] ? `<img src="${art[icon]}" alt="">` : icon) + `<kbd>${(i + 1) % 10}</kbd>`;
      b.addEventListener('click', () => pick(ch));
      ui.tools.appendChild(b);
    });
    for (let i = 0; i < 3; i++) {
      const b = document.createElement('button');
      b.textContent = `MY LEVEL ${i + 1}`;
      b.addEventListener('click', () => load(i));
      ui.slots.appendChild(b);
    }
    ui.grid.style.gridTemplateColumns = `repeat(${W}, var(--cell))`;
    for (let i = 0; i < W * H; i++) ui.grid.appendChild(document.createElement('i'));
    const at = (e) => {
      const r = ui.grid.getBoundingClientRect();
      const x = Math.floor(((e.clientX - r.left) / r.width) * W), y = Math.floor(((e.clientY - r.top) / r.height) * H);
      return x >= 0 && x < W && y >= 0 && y < H ? { x, y } : null;
    };
    ui.grid.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      painting = true;
      try { ui.grid.setPointerCapture(e.pointerId); } catch (err) { /* synthetic */ }
      const c = at(e);
      if (c) paint(c.x, c.y);
    });
    ui.grid.addEventListener('pointermove', (e) => {
      if (!painting) return;
      const c = at(e);
      if (c) paint(c.x, c.y);
    });
    for (const t of ['pointerup', 'pointercancel']) ui.grid.addEventListener(t, () => (painting = false));
    document.getElementById('edTest').addEventListener('click', tryIt);
    document.getElementById('edClear').addEventListener('click', () => {
      rows = template();
      keep();
      draw();
    });
    document.getElementById('edHome').addEventListener('click', () => api.home());
    addEventListener('keydown', key);
    addEventListener('resize', size);
  }

  function key(e) {
    if (!open) return;
    const k = e.key.toLowerCase();
    if (k.startsWith('arrow') || k === ' ') e.preventDefault();
    if (k >= '0' && k <= '9') return pick(TOOLS[(+k + 9) % 10][0]);
    if (k === 'arrowleft') cursor.x = Math.max(0, cursor.x - 1);
    else if (k === 'arrowright') cursor.x = Math.min(W - 1, cursor.x + 1);
    else if (k === 'arrowup') cursor.y = Math.max(0, cursor.y - 1);
    else if (k === 'arrowdown') cursor.y = Math.min(H - 1, cursor.y + 1);
    else if (k === ' ') return paint(cursor.x, cursor.y);
    else if (k === 'enter') return tryIt();
    else if (k === 'escape') return api.home();
    else return;
    draw();
  }

  function pick(ch) {
    tool = ch;
    for (const b of ui.tools.children) b.classList.toggle('on', b.dataset.t === ch);
    TR.sfx.tick();
  }

  function paint(x, y) {
    cursor = { x, y };
    if (rows[y][x] === tool) return draw();
    // one Teddy and one Tommy: putting one down moves him
    if (tool === '1' || tool === '2') rows = rows.map((r) => r.split(tool).join('.'));
    rows[y] = rows[y].slice(0, x) + tool + rows[y].slice(x + 1);
    keep();
    draw();
    TR.sfx.tick();
  }

  function keep() {
    api.save(slot, rows.slice());
  }

  function load(i) {
    slot = i;
    const saved = api.load(i);
    rows = saved && saved.length === H ? saved.map((r) => (r + '.'.repeat(W)).slice(0, W)) : template();
    if (!saved) keep();
    [...ui.slots.children].forEach((b, k) => b.classList.toggle('on', k === i));
    draw();
  }

  // what's missing before it can be played
  function problems() {
    const all = rows.join('');
    const out = [];
    if (!all.includes('1')) out.push('PUT TEDDY IN!');
    const gold = all.split('$').length - 1;
    if (!gold) out.push('ADD SOME GOLD!');
    if (gold > 12) out.push('12 GOLD AT MOST!');
    if (!rows[0].includes('S')) out.push('THE RAINBOW LADDER MUST REACH THE TOP ROW!');
    return out;
  }

  function draw() {
    const art = api.art();
    const cells = ui.grid.children;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const ch = rows[y][x], el = cells[y * W + x];
        const t = TOOLS.find((tt) => tt[0] === ch);
        el.style.background = BG[ch] || '';
        el.innerHTML = ch === '.' || ch === '#' || ch === '@' || !t ? '' : art[t[1]] ? `<img src="${art[t[1]]}" alt="">` : t[1];
        el.style.opacity = ch === 'S' ? 0.75 : '';
        el.classList.toggle('k', x === cursor.x && y === cursor.y);
      }
    }
    const all = rows.join('');
    const p = problems();
    ui.info.textContent = p.length ? p[0] : `💰 ${all.split('$').length - 1} · 🤖 ${all.split('R').length - 1} · TAP A TOOL, THEN THE GRID. THEN TRY IT!`;
  }

  function size() {
    if (!open) return;
    const top = ui.tools.getBoundingClientRect().bottom, bottom = ui.slots.parentElement.getBoundingClientRect().height + ui.info.getBoundingClientRect().height + 40;
    const availW = innerWidth - 62 - 24, availH = innerHeight - top - bottom - 10;
    const cell = Math.max(12, Math.floor(Math.min(availW / W, availH / H)));
    ui.grid.style.setProperty('--cell', cell + 'px');
    ui.grid.style.gridTemplateRows = `repeat(${H}, ${cell}px)`;
    ui.grid.style.fontSize = Math.round(cell * 0.7) + 'px';
  }

  function tryIt() {
    const p = problems();
    if (p.length) {
      api.toast(p[0], 'hint');
      TR.sfx.nope();
      return;
    }
    const spec = TR.parse({ id: 'mine', rows });
    const sol = TR.solve(spec, { limit: 3e6 });
    api.toast(sol.ok ? 'I CHECKED: YOU CAN WIN THIS ONE! ✅' : "HMM, I CAN'T FIND A WAY TO WIN. TRY IT ANYWAY!", 'save');
    open = false;
    api.test(slot);
  }

  TR.editor = {
    init,
    open(i = 0) {
      open = true;
      load(i);
      pick(tool);
      size();
      requestAnimationFrame(size);
    },
    close() { open = false; },
    get rows() { return rows && rows.slice(); },
    get slot() { return slot; },
    paint, pick, tryIt, problems,
    get isOpen() { return open; },
  };
})();

</script>
<script>
/* TT Treasure Runner: the game. Grab all the gold, then climb the rainbow exit ladder to the top. You can't jump: dig holes
   to your lower left or right (Z / X) to drop through floors and to trap the googly-eyed robot vacuums.
   Screens: home (PLAY, MAKE A LEVEL, 1 or 2 players, Teddy or Tommy, 🐣 EASY or 🔥 NORMAL) → the level picker (30 levels and
   your own) → READY? GO! → play → LEVEL CLEARED (signature move, confetti, score) or OUT OF LIVES. The level maker is
   js/editor.js. 1 player: your brother comes when you call (js/buddy.js). 2 players: two runners on the same level.
   window.game is a test hook: see the README. */
(function () {
  'use strict';
  const T = THREE;
  const TR = window.TR;
  const S = Kit.sound;
  const ST = TR.stage;
  const { rand } = Kit.gfx;
  const { LEFT, RIGHT, UP, DOWN } = TR;
  const $ = (id) => document.getElementById(id);
  const SAB = (typeof location !== 'undefined' && new URLSearchParams(location.search).get('sabotage')) || null;

  const CFG = {
    scale: 0.46, // the runners in a level of 1 m cells (a boy is about 0.9 m tall)
    buddy: 0.85, // the visiting brother, times his roster buddyScale (he stands beside the level on the grass, so bigger)
    demoLevel: 20, // the level running behind the title (ROBOT PARTY)
    maxLives: 9,
  };
  const LEVELS = TR.LEVELS;
  const NAME = { teddy: 'TEDDY', tommy: 'TOMMY' };

  // ---------------------------------------------------------------- saves

  const SAVE = 'treasureRunnerTT.v1';
  const save = { prefs: { players: 1, who: 'teddy', tier: 'easy' }, done: { teddy: {}, tommy: {}, team: {} }, hi: { easy: 0, normal: 0 }, mine: [null, null, null] };
  try {
    const s = JSON.parse(localStorage.getItem(SAVE) || 'null');
    if (s && s.prefs) Object.assign(save.prefs, s.prefs);
    if (s && s.done) for (const k of ['teddy', 'tommy', 'team']) Object.assign(save.done[k], s.done[k] || {});
    if (s && s.hi) Object.assign(save.hi, s.hi);
    if (s && Array.isArray(s.mine)) s.mine.slice(0, 3).forEach((m, i) => (save.mine[i] = m));
  } catch (e) { /* storage blocked: play without saving */ }
  function store() {
    try { localStorage.setItem(SAVE, JSON.stringify(save)); } catch (e) { /* storage blocked */ }
  }
  const prefs = save.prefs;
  const profile = () => (G.players === 2 ? 'team' : G.who);

  // ---------------------------------------------------------------- state

  const G = {
    state: 'boot', players: 1, who: 'teddy', tier: 'easy', level: null, s: null, world: null, runScore: 0, lives: 3, timers: [], held: false, last: 0,
    demo: null, pausedFrom: null, focus: 0, result: null, count: 0, countT: 0, stuckT: 0, stuckSaid: false, auto: null, grabSaid: false, streak: 0,
  };
  let ui = null, art = null, flyers = null, bursts = null;
  const people = { teddy: TR.makeActor(), tommy: TR.makeActor() };
  const tags = {};
  const inputs = [{ dir: 0, dig: 0 }, { dir: 0, dig: 0 }];
  const heldKeys = [[], []]; // directions held down, latest last, per player
  const touchDir = [0, 0];
  let touchSeen = false;

  const later = (secs, fn) => G.timers.push({ t: secs, fn });

  // ---------------------------------------------------------------- toasts and bits

  function toast(text, cls = '') {
    const d = document.createElement('div');
    d.className = 'toast ' + cls;
    d.textContent = text;
    ui.toasts.appendChild(d);
    while (ui.toasts.children.length > 3) ui.toasts.firstChild.remove();
    setTimeout(() => d.remove(), cls === 'save' || cls === 'hint' ? 3100 : 2100);
  }
  const show = (el, on) => el.classList.toggle('hidden', !on);
  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  const faceImg = (id) => `<img src="${art[id]}" alt="">`;
  const levelLabel = (lv) => (lv.mine ? `MY LEVEL ${lv.mine}` : lv.name ? `LEVEL ${lv.id}: ${lv.name}` : 'MY LEVEL');
  const runnerIds = () => (G.players === 2 ? ['teddy', 'tommy'] : [G.who]);
  const runnerActor = (i) => people[runnerIds()[i]];

  // ---------------------------------------------------------------- the autopilot (the title screen's demo, and game.auto for tests)
  // It plays the solver's moves one at a time by holding a direction until the runner sets off, like a player would.

  function makePilot(s, moves) {
    const r = s.runners[0];
    let i = 0, phase = 'next', dir = 0, t = 0;
    const W = s.W;
    const rest = () => TR.atRest(s, r) && r.how !== 'dig';
    return {
      get done() { return i >= moves.length; },
      get index() { return i; },
      tick(inp, dt) {
        inp.dir = 0;
        t += dt;
        if (i >= moves.length || s.won || r.how === 'caught') return;
        const m = moves[i], mine = r.y * W + r.x;
        if (phase === 'next') {
          for (let c = 0; c < s.spec.n; c++) if (s.hole[c] && c !== mine) return; // wait for other holes to fill
          if (!rest()) return;
          t = 0;
          if (m.act === 'pop') phase = 'pop';
          else if (m.act === 'digL' || m.act === 'digR') {
            inp.dig = m.act === 'digL' ? -1 : 1;
            dir = m.act === 'digL' ? LEFT : RIGHT;
            phase = 'digging';
          } else {
            dir = { walkL: LEFT, walkR: RIGHT, up: UP, down: DOWN }[m.act];
            phase = 'hold';
          }
          return;
        }
        if (phase === 'digging') {
          if (r.how === 'dig' || t < 0.05) return;
          phase = 'hold';
          t = 0;
        }
        if (phase === 'hold') {
          if (r.moving || t > 1.2) phase = 'settle';
          else inp.dir = dir;
          return;
        }
        if (phase === 'settle' && rest()) {
          i++;
          phase = 'next';
        }
        if (phase === 'pop' && !s.hole[mine] && rest()) {
          i++;
          phase = 'next';
        }
      },
    };
  }

  // ---------------------------------------------------------------- the people in the level

  function setupPeople(ids, withTags) {
    for (const id of ['teddy', 'tommy']) {
      people[id].visible = ids.includes(id);
      people[id].setScale(CFG.scale);
      people[id].react('idle');
      people[id].drop();
      tags[id].visible = withTags;
    }
  }

  // Put each runner's character where the rules say he is, doing what he's doing.
  const lastMove = [0, 0];
  function syncRunners(s, world, ids, dt) {
    s.runners.forEach((r, i) => {
      const a = people[ids[i]];
      if (!a) return;
      const x = TR.px(r), y = TR.py(r);
      const p = world.at(x, y, a.root.position);
      p.z = 0.28;
      if (r.moving) lastMove[i] = 0;
      else lastMove[i] += dt;
      let base = 'stand';
      const face = r.face < 0 ? 'left' : 'right';
      const below = r.y >= s.H - 1 ? TR.STONE : s.spec.tiles[(r.y + 1) * s.W + r.x];
      const onFloor = (below === TR.BRICK && !s.hole[(r.y + 1) * s.W + r.x]) || below === TR.STONE;
      if (s.won || s.over) base = r.how === 'caught' ? 'giggle' : 'stand'; // the winner turns round for his signature move
      else if (r.how === 'caught') base = 'giggle';
      else if (r.how === 'dig') base = 'dig';
      else if (r.how === 'fall') base = 'fall';
      else if (r.how === 'climb' || (r.how === 'ladder' && !onFloor)) base = 'climb';
      else if (r.how === 'bar') base = 'hang';
      else if (r.how === 'walk' || lastMove[i] < 0.25) base = 'run';
      a.show(base, r.moving, base === 'run' || base === 'dig' ? face : 'you');
    });
  }

  // ---------------------------------------------------------------- layout

  function hudBottom() {
    const r = ui.hudtop.getBoundingClientRect();
    return r.height ? r.bottom + 6 : 70;
  }

  // Margins round the level: the HUD on top, the kit's buttons down the left, the touch pads and your brother's button.
  function margins(forDemo) {
    const W = ST.W, H = ST.H, wide = W / H > 1.15;
    if (forDemo) return wide ? { l: 40, r: W * 0.48, t: 10, b: 10 } : { l: 50, r: 6, t: 30, b: H * 0.58 };
    const m = { l: 60, r: 12, t: hudBottom(), b: 12 };
    const boxes = [ui.pad0, ui.pad1, ui.digpad, ui.callBtn].filter((el) => !el.classList.contains('hidden') && !el.classList.contains('gone')).map((el) => el.getBoundingClientRect());
    for (const b of boxes) {
      if (!b.width) continue;
      if (wide) {
        if (b.left < W / 2) m.l = Math.max(m.l, b.right + 8);
        else m.r = Math.max(m.r, W - b.left + 8);
