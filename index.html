<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%233aa9ff'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('💰', '#3aa9ff');
</script>

<style>
  :root {

  .gone { display: none !important; }

  /* ---------- big chunky buttons ---------- */

    font-size: clamp(40px, 7vmin, 58px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #e9e3ff); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }

  .bigbtn .word { font-family: var(--display); font-size: clamp(22px, 4.4vmin, 36px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; white-space: nowrap; }
  .bigbtn:active, .tile:active, .seg button:active, .ibtn:active, .lv:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {

  }

  /* ---------- home ---------- */

  @media (max-aspect-ratio: 115/100) { #home { left: 0; right: 0; bottom: max(8px, env(safe-area-inset-bottom)); height: 58vh; justify-content: flex-start; padding-left: 62px; padding-right: 12px; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--cyan); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(34px, 7.4vmin, 76px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0,0,0,.2); letter-spacing: 1px; white-space: nowrap; }

  .tiles { display: flex; gap: clamp(12px, 3vmin, 28px); }

  .tile .go { position: absolute; right: 5px; top: 5px; width: 21%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(160deg, #8ef56b, #2dbf4e); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; font-size: clamp(16px, 3.2vmin, 28px); }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 1.5vh, 13px); }

  .hi { font-family: var(--display); font-size: clamp(13px, 2.3vmin, 20px); padding: 4px 14px; border-radius: 999px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; white-space: nowrap; }

  /* ---------- HUD ---------- */

  .hudtop { position: absolute; left: var(--pad); right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .hudtop button { pointer-events: auto; flex-shrink: 0; }
  .hudright { display: flex; gap: 8px; }
  .hudmid { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; flex: 1; min-width: 0; }
  .pill { display: flex; align-items: center; gap: clamp(5px, 1.2vmin, 10px); padding: 3px 12px; border-radius: 999px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; font-family: var(--display); font-size: clamp(13px, 2.5vmin, 22px); white-space: nowrap; }
  .pill b { font-weight: 400; color: var(--yellow); font-variant-numeric: tabular-nums; }

  @keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); } }
  .pill.lvl { font-size: clamp(12px, 2.2vmin, 19px); }
  .pill .hearts { letter-spacing: -2px; }
  @media (max-width: 640px) { .hudmid .pill.hiP { display: none; } .pill { font-size: 13px; padding: 2px 9px; } }
  @media (max-height: 430px) { .ibtn { width: 44px; height: 44px; font-size: 21px; border-radius: 14px; border-width: 3px; } .pill { font-size: 13px; padding: 2px 9px; } .pill.lvl { font-size: 11px; } }

  /* ---------- touch pad ---------- */
  .pad { position: fixed; z-index: 7; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; touch-action: none; }
  .pad.left { left: max(12px, env(safe-area-inset-left)); }
  .pad.right { right: max(12px, env(safe-area-inset-right)); }
  .dpad { position: relative; width: var(--dp, 168px); height: var(--dp, 168px); border-radius: 50%; background: rgba(20, 18, 31, 0.28); border: 4px solid rgba(255,255,255,0.9); touch-action: none; }
  .dpad i { position: absolute; width: 36%; height: 36%; display: grid; place-items: center; font-style: normal; font-size: calc(var(--dp, 168px) * 0.19); color: var(--ink); background: rgba(255,255,255,0.92); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); pointer-events: none; }
  .dpad i.u { left: 32%; top: 2%; } .dpad i.d { left: 32%; bottom: 2%; } .dpad i.l { left: 2%; top: 32%; } .dpad i.r { right: 2%; top: 32%; }
  .dpad i.on { background: var(--yellow); transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .digs { display: flex; gap: 10px; }
  .digbtn { width: var(--db, 86px); height: var(--db, 86px); border-radius: 26px; background: linear-gradient(160deg, #ffe08a, #ffb02e); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); display: grid; place-items: center; font-size: calc(var(--db, 86px) * 0.36); line-height: 1; color: var(--ink); touch-action: none; position: relative; }
  .digbtn span { font-size: 0.6em; position: absolute; bottom: 6%; }
  .digbtn.on { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .pad.two .dpad { --dp: 140px; }
  .pad.two .digbtn { --db: 62px; border-radius: 18px; }
  @media (max-height: 430px) { .dpad { --dp: 132px; } .digbtn { --db: 66px; border-radius: 20px; } .pad.two .dpad { --dp: 118px; } .pad.two .digbtn { --db: 52px; } .pad { gap: 6px; } }

  /* your brother's button (1 player) / the high five (2 players) */
  .callbtn {
    position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
    width: clamp(78px, 13vmin, 112px); aspect-ratio: 1; border-radius: 50%; padding: 6px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; font-size: clamp(36px, 6.4vmin, 56px); line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 34px; height: 34px; border-radius: 10px; background: #fff; color: var(--ink); font: 400 18px/30px var(--display); text-align: center; border: 3px solid var(--ink); }
  .callbtn.touch kbd { display: none; }
  .callbtn.touch { width: 76px; }
  .callbtn.center { right: auto; left: 50%; transform: translateX(-50%); }
  .callbtn:active { box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(18px, 4vmin, 36px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 2s ease-out forwards;
  }
  .toast.save { color: #7df7c8; animation-duration: 3s; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.hint { color: #fff; font-size: clamp(15px, 3.2vmin, 26px); animation-duration: 3s; }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-30px); opacity: 0; } }
  #count { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-size: clamp(70px, 20vmin, 180px); color: var(--yellow); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); }
  #count span { animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }

  /* ---------- the level picker ---------- */
  #levels { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 12px 62px; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; overflow-y: auto; touch-action: pan-y; }
  .lvhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .lvhead img { width: clamp(46px, 7vmin, 64px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); }
  .lvgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: clamp(7px, 1.4vmin, 12px); width: min(100%, 940px); }
  @media (max-aspect-ratio: 1/1) { .lvgrid { grid-template-columns: repeat(5, 1fr); } }
  @media (max-height: 430px) { .lvgrid { grid-template-columns: repeat(10, 1fr); gap: 5px; } }
  .lv {
    position: relative; aspect-ratio: 1; border-radius: 20px; border: 4px solid #fff; background: linear-gradient(160deg, #fffbe9, #ffe2a6); box-shadow: 0 6px 0 var(--ink); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--display); min-width: 0;
  }

  .lv.focus { outline: 5px solid var(--cyan); outline-offset: 3px; }

  @media (max-height: 430px) { .lv { border-radius: 12px; border-width: 3px; } .lv .n { font-size: 16px; } .lv .s { font-size: 9px; } }
  .lvlabel { font-family: var(--display); font-size: clamp(14px, 2.6vmin, 22px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
  .lvmine { display: flex; gap: clamp(7px, 1.4vmin, 12px); }
  .lvmine .lv { width: clamp(56px, 9vmin, 88px); }
  .lvback { display: flex; gap: 14px; }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 14px; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px); padding: clamp(14px, 3vmin, 28px); border-radius: 40px; background: linear-gradient(170deg, #fff8e6, #ffe2b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; max-height: 96vh; }

  .rface .big { font-size: clamp(50px, 11vmin, 92px); line-height: 1; animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(24px, 5.6vmin, 52px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 88vw; }

  .rinfo .rec { color: #2dbf4e; width: 100%; }

  #pause .panel { flex-direction: row; gap: 20px; flex-wrap: wrap; justify-content: center; }
  @media (max-width: 560px) { .overlay { padding-left: 58px; padding-right: 8px; } }
  @media (max-height: 430px) { .panel { gap: 6px; padding: 10px 20px; border-radius: 28px; } .rface img { width: 50px; } .rface .big { font-size: 42px; } .bigbtn { height: 58px; min-width: 58px; font-size: 28px; border-radius: 20px; } .bigbtn .word { font-size: 18px; } .rtitle { font-size: 22px; } }

  /* ---------- the level maker ---------- */
  #editor { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) 62px; background: linear-gradient(180deg, #8fd6ff, #d9f2ff); transition: opacity 0.25s; }
  .edbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }

  .tool.on { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 3px var(--ink); transform: scale(1.08); }
  .tool kbd { position: absolute; right: -4px; bottom: -6px; font: 400 11px/16px var(--display); background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 0 3px; }
  @media (hover: none) and (pointer: coarse) { .tool kbd { display: none; } }
  .edgrid { display: grid; gap: 1px; background: #7a6a55; border: 5px solid #b5763c; border-radius: 8px; touch-action: none; }
  .edgrid i { display: grid; place-items: center; font-style: normal; line-height: 1; background: #fff1d2; overflow: hidden; }
  .edgrid i.k { outline: 3px solid var(--pink); outline-offset: -3px; }
  .edgrid i img { width: 92%; height: 92%; border-radius: 50%; }
  .edinfo { font-family: var(--display); font-size: clamp(12px, 2.2vmin, 18px); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 2px 0 var(--ink); text-align: center; }
  .edslots { display: flex; gap: 6px; }
  .edslots button { height: clamp(40px, 6vmin, 52px); padding: 0 12px; border-radius: 14px; border: 3px solid #fff; background: rgba(255,255,255,0.6); box-shadow: 0 4px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(13px, 2.3vmin, 18px); }
  .edslots button.on { background: var(--yellow); }
  .edbtns { display: flex; gap: 10px; }
  .edbtns .bigbtn { height: clamp(52px, 8vmin, 72px); min-width: clamp(52px, 8vmin, 72px); font-size: clamp(24px, 4vmin, 34px); border-radius: 20px; }
  .edbtns .bigbtn .word { font-size: clamp(16px, 2.8vmin, 24px); }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #9fdcff; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .callbtn.here, .lv.next, .ibtn.glow { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tagline">GRAB ALL THE GOLD! DIG HOLES! DODGE THE ROBOTS!</div>
  <div class="tiles">
    <button class="tile play" id="goPlay" title="Play (1)" aria-label="Play"><span class="emo">💰</span><b>PLAY</b><span class="go">▶</span></button>
    <button class="tile make" id="goMake" title="Make a level (2)" aria-label="Make a level"><span class="emo">🧱</span><b>MAKE A LEVEL</b><span class="go">✏️</span></button>
  </div>
  <div class="opts">
    <div class="seg" id="segPlayers" role="radiogroup" aria-label="Players">
      <button data-v="1"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="2"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy"><img alt="" draggable="false">TEDDY</button>
      <button data-v="tommy"><img alt="" draggable="false">TOMMY</button>
    </div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
    </div>
  </div>
  <div class="hi" id="homeHi"><span>HI-SCORE</span> 🐣 <b id="hiEasy">0</b> · 🔥 <b id="hiNormal">0</b></div>
</div>

<!-- the level picker -->
<div id="levels" class="hidden">
  <div class="lvhead">
    <img id="lvFace" alt="" draggable="false">
    <div class="seg" id="lvTier" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
    </div>
    <div class="pill"><span>💰</span> <b id="lvDone">0</b> / <b>30</b></div>
  </div>
  <div class="lvgrid" id="lvGrid"></div>
  <div class="lvlabel" id="lvMineLabel">MY LEVELS</div>
  <div class="lvmine" id="lvMine"></div>
  <div class="lvback"><button class="bigbtn" id="lvMake" aria-label="Make a level">✏️</button><button class="bigbtn" id="lvHome" aria-label="Home">🏠</button></div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div class="pill lvl"><span id="lvlName"></span></div>
      <div class="pill"><span>💰</span><b id="goldGot">0</b>/<b id="goldAll">0</b></div>
      <div class="pill"><span>SCORE</span> <b id="score">0</b></div>
      <div class="pill hiP"><span>HI</span> <b id="hi">0</b></div>
      <div class="pill"><span class="hearts" id="hearts">❤️</span><b id="lives">3</b></div>
    </div>
    <div class="hudright">
      <button class="ibtn" id="restartBtn" title="Start again (R)" aria-label="Start again">🔄</button>
      <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
</div>

<!-- touch: a pad to move and buttons to dig (one set each in 2 players) -->
<div class="pad left hidden" id="pad0"><div class="digs" id="digs0b"></div><div class="dpad" id="dpad0"><i class="u">▲</i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i></div></div>
<div class="pad right hidden" id="pad1"><div class="digs" id="digs1b"></div><div class="dpad" id="dpad1"><i class="u">▲</i><i class="l">◀</i><i class="r">▶</i><i class="d">▼</i></div></div>
<div class="pad right hidden" id="digpad"><div class="digs"><button class="digbtn" id="digL" aria-label="Dig left">⛏️<span>◀</span></button><button class="digbtn" id="digR" aria-label="Dig right">⛏️<span>▶</span></button></div></div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother"><img id="callFace" alt=""><span class="gone" id="five">🙌</span><kbd>T</kbd></button>

<div id="toasts"></div>
<div id="count" class="hidden"></div>

<!-- a level done -->
<div id="winPanel" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="wFace"></div>
    <div class="rtitle" id="wTitle"></div>
    <div class="rinfo" id="wInfo"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="wNext" aria-label="Next level">▶</button>
      <button class="bigbtn" id="wAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="wLevels" aria-label="Levels">🔢</button>
      <button class="bigbtn" id="wHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- out of lives -->
<div id="overPanel" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="oFace"></div>
    <div class="rtitle">OUT OF LIVES!</div>
    <div class="rinfo" id="oInfo"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="oAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="oLevels" aria-label="Levels">🔢</button>
      <button class="bigbtn" id="oHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start again">🔄</button>
    <button class="bigbtn" id="pLevels" aria-label="Levels">🔢</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<!-- the level maker -->
<div id="editor" class="hidden">
  <div class="edbar" id="edTools"></div>
  <div class="edgrid" id="edGrid"></div>
  <div class="edinfo" id="edInfo"></div>
  <div class="edbar">
    <div class="edslots" id="edSlots"></div>
    <div class="edbtns">
      <button class="bigbtn go" id="edTest" aria-label="Try it"><span class="word">TRY IT</span></button>
      <button class="bigbtn" id="edClear" aria-label="Start a new level">🆕</button>
      <button class="bigbtn" id="edHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<div id="loading"><span>💰</span></div>

<script src="kit/three.min.js"></script>
<script src="kit/gfx.js"></script>
<script src="kit/people.js"></script>
<script src="kit/roster.js"></script>
<script src="kit/portraits.js"></script>
<script src="kit/sound.js"></script>
<script src="kit/lang.js"></script>
<script src="kit/help.js"></script>
<script src="js/title.js"></script>
<script src="js/rules.js"></script>
<script src="js/levels.js"></script>
<script src="js/check.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/stage.js"></script>
<script src="js/world.js"></script>
<script src="js/actor.js"></script>
<script src="js/buddy.js"></script>
<script src="js/editor.js"></script>
<script src="js/game.js"></script>
<script src="js/keys.js"></script>
<script src="js/zh.js"></script>
</body>
</html>
